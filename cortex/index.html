  let b = -1;
  for (let i = path.length - 1 - keep; i >= 0; i--) if (path[i].role === 'assistant') { b = i; break; }
  if (b < 0) { if (force) toast('Conversation trop courte pour être compactée'); return false; }
  let prevIdx = -1;
  for (let i = b; i >= 0; i--) if (path[i].summary) { prevIdx = i; break; }
  if (prevIdx === b) return false;
  const prev = prevIdx >= 0 ? path[prevIdx].summary.text : '';
  const slice = path.slice(prevIdx + 1, b + 1);
  const ev = tracer?.begin('compact', `Compaction (${slice.length} messages)`);
  try {
    const r = await quickComplete([
      { role: 'system', content: "Tu compactes l'historique d'une conversation entre un utilisateur et un assistant IA pour qu'elle continue sans perte d'information essentielle. Produis un résumé structuré, dense et factuel en français : objectifs de l'utilisateur, faits et données clés (chiffres, noms, URLs), décisions prises, contenus produits (code, fichiers : noms et rôle), préférences exprimées, questions en suspens, prochaine étape. N'invente rien." },
      { role: 'user', content: (prev ? 'Résumé antérieur :\n' + prev + '\n\nSuite de la conversation :\n' : '') + truncate(transcript(slice), 120000) },
    ], { maxTokens: 2000, kind: 'compact', extra: noReasoning(utilityModel()) });
    if (!r.text) throw new Error('résumé vide');
    path[b].summary = { text: r.text, at: now(), count: b + 1 };
    saveChat(chat);
    ev?.end({});
    return true;
  } catch (e) { ev?.end({ error: e.message }); if (force) toast('Compaction échouée : ' + e.message, 'err'); return false; }
}
function noReasoning(model) {
  const m = getModel(model);
  return m && modelSupports(model, 'reasoning') && !m.reasoning?.mandatory ? { reasoning: { enabled: false } } : {};
}

/* ---------- Exécution d'une réponse d'assistant ---------- */
function createAssistantNode(chat, parentId, model, extra = {}) {
  const n = { id: uid('n'), parentId, role: 'assistant', model, agentId: chat.agentId, steps: [], status: 'running', createdAt: now() + Math.random(), ...extra };
  chat.nodes[n.id] = n;
  return n;
}
async function runAssistant(chat, node, opts = {}) {
  const c = cfg(chat);
  if (opts.cfgOverride) Object.assign(c, opts.cfgOverride);
  const model = node.model || c.model;
  c.model = model;
  const ctrl = new AbortController();
  S.running.set(node.id, { chatId: chat.id, ctrl });
  const runData = { id: uid('r'), nodeId: node.id, model, startedAt: now(), endedAt: null, cost: 0, tokens: { prompt: 0, completion: 0, reasoning: 0 }, events: [], status: 'running' };
  chat.runs = [...(chat.runs || []), runData].slice(-30);
  node.runId = runData.id;
  node.status = 'running';
  node.error = null;
  node.notes = [];
  const tracer = new Tracer(runData, chat.id);
  const onUpdate = () => { S.onNodeUpdate?.(chat, node); saveChat(chat, 2000); };
  S.onRunState?.(chat);
  const t0 = now();
  try {
    const path = pathTo(chat, node.parentId);
    const userNode = path[path.length - 1];
    const tools = opts.noTools ? [] : resolveTools(c.tools);
    let system, history;
    if (opts.custom) ({ system, history } = opts.custom);
    else {
      let h = buildHistory(chat, path, model);
      let sys = await buildSystem(chat, c, userNode?.content || '', { summary: h.summary, tools });
      const limit = contextLimit(model) - Math.max(+c.params.max_tokens || 0, 4096);
      let est = estTokens(sys.text) + estMessages(h.messages) + estTokens(JSON.stringify(tools.map(toolSchema)));
      if (S.settings.harness.autoCompact && est > limit * S.settings.harness.compactAt && path.length > (S.settings.harness.keepRecent || 6) + 1) {
        if (await compactChat(chat, path, tracer)) {
          h = buildHistory(chat, path, model);
          sys = await buildSystem(chat, c, userNode?.content || '', { summary: h.summary, tools });
          est = estTokens(sys.text) + estMessages(h.messages);
        }
      }
      while (est > limit && h.messages.length > 1 && !S.settings.harness.middleOut) {
        const dropped = h.messages.shift();
        while (h.messages.length > 1 && h.messages[0].role !== 'user') h.messages.shift();
        est -= estMessages([dropped]);
        if (!node.notes.includes('trunc')) { node.notes.push('trunc'); tracer.note('Historique tronqué pour tenir dans le contexte'); }
      }
      node.ctx = { est, limit: contextLimit(model), sec: Object.fromEntries(Object.entries(sys.sec).map(([k, v]) => [k, estTokens(v)])), history: estMessages(h.messages), tools: estTokens(JSON.stringify(tools.map(toolSchema))) };
      system = sys.text; history = h.messages;
    }
    const notes = [];
    await agentLoop({ chat, node, steps: node.steps, model, cfg: c, system, history, tools, depth: 0, signal: ctrl.signal, run: tracer, onUpdate, maxSteps: c.maxSteps, notes });
    node.notes.push(...notes);
    node.status = ctrl.signal.aborted ? 'stopped' : 'done';
    if (Hooks.has('onAfterResponse')) {
      const last = [...node.steps].reverse().find((s) => s.content);
      if (last) { const r = await Hooks.run('onAfterResponse', { content: last.content, model }, tracer); if (r && typeof r.content === 'string') last.content = r.content; }
    }
  } catch (e) {
    console.error(e);
    node.status = 'error';
    node.error = e.message || String(e);
    node.errorStatus = e.status || 0;
    tracer.note('Erreur : ' + node.error);
  } finally {
    S.running.delete(node.id);
    node.durationMs = now() - t0;
    node.usage = { cost: runData.cost, prompt: runData.tokens.prompt, completion: runData.tokens.completion, reasoning: runData.tokens.reasoning };
    for (const s of node.steps) if (s.status === 'streaming') s.status = 'stopped';
    runData.endedAt = now();
    runData.status = node.status;
    saveChat(chat);
    S.onNodeUpdate?.(chat, node, true);
    S.onRunState?.(chat);
    if (document.hidden && node.status !== 'stopped') attention(node.status === 'error' ? 'Erreur de génération' : 'Réponse prête', chat, true);
  }
}
/* Envoie un message utilisateur et lance la/les réponse(s) */
async function sendUserMessage(chat, text, attachments = [], { models } = {}) {
  const parentId = chat.leafId || null;
  const userNode = { id: uid('n'), parentId, role: 'user', content: text, attachments, createdAt: now() };
  chat.nodes[userNode.id] = userNode;
  chat.selected[parentId || 'root'] = userNode.id;
  const list = models || (chat.compare?.length >= 2 ? chat.compare : [cfg(chat).model]);
  if (list.length > 1) { userNode.compare = true; userNode.blind = !!(chat.arena && S.settings.arenaBlind); }
  chat.leafId = userNode.id;
  saveChat(chat);
  await respond(chat, userNode, list);
}
async function respond(chat, userNode, models, extra = {}) {
  const nodes = models.map((m) => createAssistantNode(chat, userNode.id, m, extra));
  chat.selected[userNode.id] = nodes[0].id;
  chat.leafId = nodes[0].id;
  S.onStructure?.(chat);
  models.forEach((m) => pushRecentModel(m));
  await Promise.all(nodes.map((n) => runAssistant(chat, n)));
  afterTurn(chat, userNode, nodes);
}
async function afterTurn(chat, userNode, nodes) {
  const ok = nodes.find((n) => n.status === 'done' && nodeText(n));
  if (!ok) return;
  if (S.settings.autoTitle && chat.title === 'Nouvelle conversation') generateTitle(chat, userNode, ok);
  if (S.settings.followUps && nodes.length === 1) generateFollowUps(chat, ok);
}
async function generateTitle(chat, userNode, node) {
  const fallback = () => { const t = (userNode.content || '').replace(/\s+/g, ' ').trim().split(' ').slice(0, 7).join(' '); return truncate(t || 'Conversation', 60); };
  try {
    const r = await quickComplete([
      { role: 'system', content: 'Tu génères des titres de conversation. Réponds UNIQUEMENT par le titre : 3 à 6 mots, en français, sans guillemets, sans emoji, sans ponctuation finale.' },
      { role: 'user', content: `Message : ${truncate(userNode.content || '', 800)}\n\nDébut de réponse : ${truncate(nodeText(node), 500)}` },
    ], { maxTokens: 400, kind: 'title', temperature: 0.2, extra: noReasoning(utilityModel()) });
    let t = (r.text || '').split('\n').map((l) => l.trim()).find(Boolean) || '';
    t = t.replace(/^(titre\s*:\s*)/i, '').replace(/\*\*|__|^#+\s*|["«»“”`]/g, '').replace(/[.!?:;]+$/, '').replace(/\s+/g, ' ').trim();
    chat.title = t && t.length < 80 ? t : fallback();
  } catch (e) { chat.title = fallback(); }
  saveChat(chat);
  S.onChatsChanged?.();
}
async function generateFollowUps(chat, node) {
  try {
    const r = await quickComplete([
      { role: 'system', content: 'Propose 3 relances courtes (max 12 mots chacune) que l\'utilisateur pourrait envoyer ensuite. Réponds uniquement par un tableau JSON de 3 chaînes.' },
      { role: 'user', content: truncate(transcript(pathTo(chat, node.id).slice(-4)), 6000) },
    ], { maxTokens: 400, kind: 'suggest', extra: noReasoning(utilityModel()) });
    const m = r.text.match(/\[[\s\S]*\]/);
    const arr = m ? safeJSON(m[0]) : null;
    if (Array.isArray(arr)) { node.followUps = arr.filter((x) => typeof x === 'string').slice(0, 3); saveChat(chat); S.onNodeUpdate?.(chat, node, true); }
  } catch {}
}
/* Conseil de modèles : fusionne les réponses comparées en une réponse supérieure */
async function synthesize(chat, userNode, judgeModel) {
  const kids = kidsMap(chat)[userNode.id] || [];
  const answers = kids.filter((n) => !n.synth && nodeText(n));
  if (answers.length < 2) { toast('Il faut au moins deux réponses à fusionner'); return; }
  const model = judgeModel || cfg(chat).model;
  const path = pathTo(chat, userNode.id);
  const h = buildHistory(chat, path, model);
  const listing = answers.map((n, i) => `### Réponse ${String.fromCharCode(65 + i)} (${modelName(n.model)})\n${nodeText(n)}`).join('\n\n');
  const node = createAssistantNode(chat, userNode.id, model, { synth: true });
  chat.selected[userNode.id] = node.id;
  chat.leafId = node.id;
  S.onStructure?.(chat);
  const system = "Tu es l'arbitre d'un conseil de modèles d'IA. Plusieurs modèles ont répondu à la dernière demande de l'utilisateur. Évalue silencieusement l'exactitude, la complétude et la clarté de chaque réponse, corrige les erreurs, puis rédige LA meilleure réponse possible en fusionnant leurs meilleurs apports. Termine par une courte section « Synthèse du conseil » (2-4 puces) indiquant ce que tu as retenu de chaque réponse et les désaccords éventuels.";
  const history = [...h.messages.slice(0, -1), { role: 'user', content: (typeof h.messages.at(-1)?.content === 'string' ? h.messages.at(-1).content : nodeText(userNode)) + '\n\n---\nRéponses candidates du conseil :\n\n' + listing }];
  await runAssistant(chat, node, { custom: { system, history }, noTools: true });
}
/* Arène : vote et classement Elo */
function arenaVote(chat, userNode, winnerId) {
  const kids = (kidsMap(chat)[userNode.id] || []).filter((n) => !n.synth && n.status === 'done');
  const w = kids.find((n) => n.id === winnerId);
  if (!w || userNode.vote) return;
  const elo = S.settings.elo;
  const R = (m) => elo[m]?.r ?? 1000;
  for (const l of kids) {
    if (l.id === w.id || l.model === w.model) continue;
    const ra = R(w.model), rb = R(l.model);
    const ea = 1 / (1 + 10 ** ((rb - ra) / 400));
    elo[w.model] = { r: ra + 32 * (1 - ea), w: (elo[w.model]?.w || 0) + 1, l: elo[w.model]?.l || 0 };
    elo[l.model] = { r: rb - 32 * (1 - ea), w: elo[l.model]?.w || 0, l: (elo[l.model]?.l || 0) + 1 };
  }
  userNode.vote = winnerId;
  userNode.blind = false;
  S.settings.arenaVotes = (S.settings.arenaVotes || 0) + 1;
  saveSettings();
  selectBranch(chat, winnerId);
  saveChat(chat);
  toast('Vote enregistré : ' + modelName(w.model) + ' 🏆', 'ok');
}
function stopChat(chat) {
  for (const [id, r] of S.running) if (r.chatId === chat.id) r.ctrl.abort();
}

/* Fenêtres modales empilables */
const modalStack = [];
function openModal({ title = '', iconName = '', body = '', footer = '', size = '', onClose, flush = false, cls = '', ovCls = '' } = {}) {
  const ov = document.createElement('div');
  ov.className = 'overlay ' + ovCls;
  ov.innerHTML = `<div class="modal ${size} ${cls}" role="dialog" aria-modal="true">
    ${title !== null ? `<div class="modal-h"><h2>${iconName ? icon(iconName) : ''}${title}</h2><span class="grow"></span><button class="icon-btn" data-close title="Fermer (Échap)">${icon('x')}</button></div>` : ''}
    <div class="modal-b ${flush ? 'flush' : ''}"></div>
    ${footer ? `<div class="modal-f"></div>` : ''}
  </div>`;
  const m = ov.querySelector('.modal');
  const b = ov.querySelector('.modal-b');
  if (typeof body === 'string') b.innerHTML = body; else if (body) b.appendChild(body);
  if (footer) { const f = ov.querySelector('.modal-f'); if (typeof footer === 'string') f.innerHTML = footer; else f.appendChild(footer); }
  const api = {
    el: m, body: b, overlay: ov,
    close() {
      const i = modalStack.indexOf(api);
      if (i >= 0) modalStack.splice(i, 1);
      ov.remove();
      onClose?.();
    },
  };
  ov.addEventListener('mousedown', (e) => { if (e.target === ov) api._down = true; });
  ov.addEventListener('mouseup', (e) => { if (e.target === ov && api._down) api.close(); api._down = false; });
  ov.querySelector('[data-close]')?.addEventListener('click', () => api.close());
  document.body.appendChild(ov);
  modalStack.push(api);
  setTimeout(() => m.querySelector('[autofocus]')?.focus(), 30);
  return api;
}
function confirmDialog(message, { title = 'Confirmer', ok = 'Confirmer', danger = false } = {}) {
  return new Promise((res) => {

    const m = openModal({
      title, body: `<p style="margin:0;line-height:1.6">${message}</p>`,
      footer: `<button class="btn ghost" data-r="0">Annuler</button><button class="btn ${danger ? 'danger' : 'primary'}" data-r="1" autofocus>${esc(ok)}</button>`,
      onClose: () => { if (!done) res(false); },
    });
    m.overlay.querySelectorAll('[data-r]').forEach((b) => b.addEventListener('click', () => { done = true; res(b.dataset.r === '1'); m.close(); }));
  });
}
function promptDialog(title, value = '', { placeholder = '', multiline = false, ok = 'Valider', hint = '' } = {}) {
  return new Promise((res) => {
    let done = false;
    const field = multiline ? `<textarea class="ta" id="pd-in" rows="6" placeholder="${esc(placeholder)}" autofocus>${esc(value)}</textarea>` : `<input class="inp" id="pd-in" value="${esc(value)}" placeholder="${esc(placeholder)}" autofocus>`;
    const m = openModal({

      footer: `<button class="btn ghost" data-r="0">Annuler</button><button class="btn primary" data-r="1">${esc(ok)}</button>`,
      onClose: () => { if (!done) res(null); },

    const inp = m.el.querySelector('#pd-in');
    setTimeout(() => { inp.focus(); if (!multiline) inp.select(); }, 40);

    m.overlay.querySelector('[data-r="1"]').addEventListener('click', submit);
    m.overlay.querySelector('[data-r="0"]').addEventListener('click', () => m.close());
  });
}

/* Menus contextuels et popovers */
let openPop = null;
function closePop() { if (openPop) { const p = openPop; openPop = null; p.el.remove(); p.onClose?.(); } }
function placeNear(el, anchor, { align = 'start', side = 'bottom' } = {}) {
  const r = anchor.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight;
  const vw = window.innerWidth, vh = window.innerHeight;
  const above = r.top - 14, below = vh - r.bottom - 14;
  // Ancrage par le bas quand le popover s'ouvre vers le haut : sa hauteur peut varier ensuite (filtrage)
  const up = side === 'top' ? above >= Math.min(h, 320) || above > below : h > below && above > below;
  el.style.left = clamp(align === 'end' ? r.right - w : r.left, 8, Math.max(8, vw - w - 8)) + 'px';
  if (up) { el.style.top = 'auto'; el.style.bottom = (vh - r.top + 6) + 'px'; el.style.maxHeight = Math.max(160, Math.min(above, vh * 0.72, 620)) + 'px'; }
  else { el.style.bottom = 'auto'; el.style.top = (r.bottom + 6) + 'px'; el.style.maxHeight = Math.max(160, Math.min(below, vh * 0.72, 620)) + 'px'; }
}
function showMenu(anchor, items, opts = {}) {
  closePop();
  const el = document.createElement('div');
  el.className = 'menu';
  el.innerHTML = items.map((it, i) => {
    if (it === '-' || it.sep) return '<div class="sep"></div>';
    if (it.header) return `<div class="mh">${esc(it.header)}</div>`;
    return `<button class="mi ${it.danger ? 'danger' : ''}" data-i="${i}" ${it.disabled ? 'disabled style="opacity:.45"' : ''}>${it.icon ? icon(it.icon, 'sm') : it.emoji ? `<span style="width:16px;text-align:center">${it.emoji}</span>` : ''}<span class="grow ellipsis">${esc(it.label)}</span>${it.checked ? `<span class="ck">${icon('check', 'sm')}</span>` : ''}${it.hint ? `<span class="faint xs">${esc(it.hint)}</span>` : ''}</button>`;
  }).join('');
  document.body.appendChild(el);
  placeNear(el, anchor, opts);
  el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-i]');
    if (!b || b.disabled) return;
    const it = items[+b.dataset.i];
    closePop();
    it.action?.();
  });
  openPop = { el, anchor, onClose: opts.onClose };
  return el;
}
function showPop(anchor, contentHTML, opts = {}) {

}

/* Image : redimensionnement/compression avant envoi */
function compressImage(dataURL, maxDim = 1800, quality = 0.88) {
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, maxDim / Math.max(img.width, img.height));
      if (s === 1 && dataURL.length < 1.5e6) return res(dataURL);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL(/png/.test(dataURL.slice(0, 30)) && dataURL.length < 3e6 ? 'image/png' : 'image/jpeg', quality));
    };
    img.onerror = () => res(dataURL);
    img.src = dataURL;
  });
}

function tagColor(t) { return `hsl(${parseInt(hashStr(t), 36) % 360} 62% 46%)`; }
function chatAvatar(chat) {
  const a = chat.agentId && col('agents').get(chat.agentId);
  if (a?.emoji) return `<span>${esc(a.emoji)}</span>`;
  return modelLogo(cfg(chat).model, 36);
}
function chatPreview(chat) {
  const leaf = chat.nodes[chat.leafId];
  return truncate(nodeText(leaf).replace(/!\[[^\]]*\]\([^)]*\)/g, '🖼').replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/[#*`>\n|]+/g, ' ').replace(/\s+/g, ' ').trim(), 70);
}
function chatMatches(chat, q) {
  if (!q) return true;
  if (fuzzyScore(q, chat.title)) return true;
  if (q.length < 2) return false;
  const nq = normalizeText(q);
  for (const n of Object.values(chat.nodes)) if (normalizeText(nodeText(n)).includes(nq)) return true;
  return false;
}
function chatItem(chat) {
  const busy = chatBusy(chat);
  const tags = (chat.tags || []).map((t) => `<span class="tag" style="background:${tagColor(t)}">${esc(t)}</span>`).join('');
  return `<div class="citem ${chat.id === S.currentChatId ? 'active' : ''}" data-chat="${chat.id}" draggable="true">

      <div class="sub">${busy ? '<span class="spin"></span>' : ''}${tags || `<span class="ellipsis grow">${esc(chatPreview(chat)) || '<i>vide</i>'}</span>`}<span class="grow" style="${tags ? '' : 'display:none'}"></span><span style="flex:none">• ${fmtRel(chat.updatedAt)}</span></div>

function dateGroup(ts) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  const t0 = d.getTime();
  if (ts >= t0) return "Aujourd'hui";
  if (ts >= t0 - 86400e3) return 'Hier';
  if (ts >= t0 - 7 * 86400e3) return '7 derniers jours';
  if (ts >= t0 - 30 * 86400e3) return '30 derniers jours';
  return 'Plus ancien';
}
function renderSidebar() {
  const sb = $('#sidebar');
  if (!sb.dataset.init) {
    sb.dataset.init = '1';

        <div class="row" style="gap:10px"><button class="btn-new" data-act="new-chat" title="Nouvelle conversation (${MOD}+Maj+O)">${icon('newchat', 'lg')} Nouveau chat</button>

function renderChatList() {
  const list = $('#chatList');
  if (!list) return;
  const q = S.ui.search.trim();
  let chats = [...col('chats').values()].filter((c) => Object.keys(c.nodes).length);
  if (S.ui.filterTag) chats = chats.filter((c) => (c.tags || []).includes(S.ui.filterTag));
  if (S.ui.filterAgent) chats = chats.filter((c) => c.agentId === S.ui.filterAgent);
  chats.sort((a, b) => b.updatedAt - a.updatedAt);
  const filterNote = S.ui.filterTag || S.ui.filterAgent ? `<div class="row" style="padding:6px 8px"><span class="badge acc">${icon('filter', 'xs')} ${esc(S.ui.filterTag || col('agents').get(S.ui.filterAgent)?.name || '')}</span><button class="cb-btn" data-act="clear-filter">Effacer</button></div>` : '';
  if (q) {
    const res = chats.filter((c) => chatMatches(c, q));
    list.innerHTML = filterNote + `<div class="group-h">Résultats <span class="cnt">${res.length}</span></div>` + (res.map(chatItem).join('') || '<div class="empty-s">Aucune conversation trouvée</div>');
    return;
  }
  const folders = [...col('folders').values()].sort((a, b) => (a.order ?? a.createdAt) - (b.order ?? b.createdAt));
  const pinned = chats.filter((c) => c.pinned && !c.folderId);
  const inFolder = (f) => chats.filter((c) => c.folderId === f.id);
  const loose = chats.filter((c) => !c.pinned && (!c.folderId || !col('folders').has(c.folderId)));
  let html = filterNote;
  html += `<div class="group-h" style="text-transform:none;font-size:.95em;color:var(--text);letter-spacing:0">${icon('down', 'sm')} Dossiers <span class="cnt">${folders.length}</span><span class="acts"><button class="icon-btn sm" data-act="new-folder" title="Nouveau dossier">${icon('folderPlus', 'sm')}</button></span></div>`;
  for (const f of folders) {
    const cs = inFolder(f);
    const closed = !!S.settings.folderClosed[f.id] && !cs.some((c) => c.id === S.currentChatId);
    html += `<div class="folder ${closed ? 'closed' : ''}" data-folder="${f.id}">
      <div class="folder-h" data-act="toggle-folder" data-id="${f.id}"><span class="chev">${icon('down', 'sm')}</span><span style="color:${f.color || 'var(--muted)'}">${icon('folder', 'sm')}</span><span class="grow ellipsis">${esc(f.name)}</span><span class="cnt badge">${cs.length}</span><button class="icon-btn sm" data-act="folder-menu" data-id="${f.id}">${icon('moreH', 'sm')}</button></div>
      <div class="folder-body">${cs.map(chatItem).join('') || '<div class="faint small" style="padding:6px 10px">Glissez une conversation ici</div>'}</div></div>`;
  }
  if (pinned.length) html += `<div class="group-h">${icon('pin', 'xs')} Épinglés</div>` + pinned.map(chatItem).join('');
  let last = '';
  for (const c of loose) {
    const g = dateGroup(c.updatedAt);
    if (g !== last) { html += `<div class="group-h" data-drop-root>${g}</div>`; last = g; }
    html += chatItem(c);
  }
  if (!chats.length) html += `<div class="empty-s">${icon('chat', 'lg')}<div style="margin-top:8px">Aucune conversation.<br>Cliquez sur « Nouveau chat » pour commencer.</div></div>`;
  list.innerHTML = html;
}

async function editTags(chat) {
  const t = await promptDialog('Étiquettes', (chat.tags || []).join(', '), { placeholder: 'travail, idées, code…', hint: 'Séparez les étiquettes par des virgules.' });

function duplicateChat(chat) {
  const c = deepClone(chat);
  c.id = uid('c'); c.title = chat.title + ' (copie)'; c.createdAt = c.updatedAt = now(); c.runs = []; c.pinned = false;
  col('chats').set(c.id, c); saveChat(c);
  openChat(c.id);
  toast('Conversation dupliquée', 'ok');
}
async function deleteChat(chat, ask = true) {
  if (ask && !(await confirmDialog(`Supprimer « <b>${esc(chat.title)}</b> » ? Cette action est définitive.`, { title: 'Supprimer la conversation', ok: 'Supprimer', danger: true }))) return;
  stopChat(chat);
  col('chats').delete(chat.id);
  DB.del('chats', chat.id);
  if (S.currentChatId === chat.id) {
    const next = [...col('chats').values()].sort((a, b) => b.updatedAt - a.updatedAt)[0];
    next ? openChat(next.id) : newChatView();

  toast('Conversation supprimée');

/* Export */
function chatToMarkdown(chat) {
  const path = pathTo(chat, chat.leafId);
  let md = `# ${chat.title}\n\n_Exporté depuis ${APP_NAME} le ${fmtDateTime(now())}_\n\n`;
  for (const n of path) {
    if (n.role === 'user') md += `## 👤 Vous\n\n${n.content || ''}\n${(n.attachments || []).map((a) => `\n> 📎 ${a.name}`).join('')}\n\n`;
    else {
      md += `## 🤖 ${modelName(n.model)}\n\n`;
      for (const s of n.steps || []) {
        if (s.content) md += s.content + '\n\n';
        for (const t of s.toolCalls || []) md += `> 🔧 **${t.name}** \`${truncate(t.args, 200)}\`\n> ${truncate((t.result || '').replace(/\n/g, ' '), 300)}\n\n`;
      }
    }
  }
  return md;
}
function exportChat(chat, fmt) {
  const name = slugify(chat.title);
  if (fmt === 'json') return download(name + '.json', JSON.stringify(chat, null, 2), 'application/json');
  const md = chatToMarkdown(chat);
  if (fmt === 'md') return download(name + '.md', md, 'text/markdown');
  const html = `<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(chat.title)}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>body{font-family:Inter,system-ui,sans-serif;max-width:820px;margin:40px auto;padding:0 20px;line-height:1.65;color:#111827}pre{background:#f6f8fa;padding:12px;border-radius:10px;overflow:auto}code{font-family:ui-monospace,monospace;font-size:.88em}h2{border-top:1px solid #e5e7eb;padding-top:18px;font-size:1.05em;color:#4b5563}table{border-collapse:collapse}td,th{border:1px solid #e5e7eb;padding:6px 10px}blockquote{border-left:3px solid #2563eb;margin:0;padding:4px 14px;color:#4b5563;background:#f8fafc}img{max-width:100%}</style></head><body>${MD.toHTML(md)}</body></html>`;
  download(name + '.html', html, 'text/html');
}

/* ---------- En-tête ---------- */
function renderHeader() {
  const chat = currentChat();
  const h = $('#chatHead');
  if (!chat) { h.innerHTML = ''; return; }
  const c = cfg(chat);
  const agent = c.agent;
  const path = pathTo(chat, chat.leafId);
  const cost = Object.values(chat.nodes).reduce((a, n) => a + (n.usage?.cost || 0), 0);
  const lastA = [...path].reverse().find((n) => n.role === 'assistant' && n.steps?.length);
  const lastStep = lastA?.steps?.filter((s) => s.usage).pop();
  const used = lastStep?.usage ? lastStep.usage.prompt + lastStep.usage.completion : lastA?.ctx?.est || 0;
  const lim = contextLimit(c.model);
  const pct = clamp(used / lim, 0, 1);
  const col_ = pct > .85 ? 'var(--danger)' : pct > .6 ? 'var(--warning)' : 'var(--success)';
  const collapsed = $('#app').classList.contains('side-collapsed');
  h.innerHTML = `
    <button class="icon-btn mobile-only" data-act="mobile-menu" title="Menu">${icon('menu')}</button>
    ${collapsed ? `<button class="icon-btn hide-sm" data-act="collapse-side" title="Afficher le panneau">${icon('panelL')}</button><button class="icon-btn hide-sm" data-act="new-chat" title="Nouveau chat">${icon('newchat')}</button>` : ''}
    <div class="chat-title ellipsis" data-act="rename-current" title="Renommer">${esc(chat.title)}</div>
    <button class="pill" data-act="pick-agent" title="Agent">${agent ? `<span>${esc(agent.emoji || '🤖')}</span><span class="ellipsis" style="max-width:140px">${esc(agent.name)}</span>` : `${icon('bot', 'sm')}<span>Sans agent</span>`}${icon('down', 'xs')}</button>
    <span class="grow"></span>
    ${Object.keys(chat.nodes).length ? `<button class="ctx-meter hide-sm" data-act="ctx-info" title="Contexte utilisé : ${fmtTokens(used)} / ${fmtTokens(lim)} tokens"><span>${fmtTokens(used)} / ${fmtTokens(lim)}</span><span class="ctx-bar"><i style="width:${Math.max(2, pct * 100)}%;background:${col_}"></i></span></button>
    <span class="pill hide-sm" title="Coût cumulé de la conversation">${icon('dollar', 'sm')}${fmtCost(cost, true)}</span>` : ''}
    <button class="icon-btn ${S.ui.inspectorOpen ? 'on' : ''}" data-act="toggle-inspector" title="Inspecteur : trace, plan, fichiers, artefacts (${MOD}+.)">${icon('panelR')}</button>
    <button class="icon-btn" data-act="chat-head-menu" title="Plus">${icon('moreV')}</button>`;
}

/* ---------- Messages ---------- */
const stepHtmlCache = new Map();
let mdRegistry = [];
function renderMessages() {
  const chat = currentChat();
  const box = $('#messages');
  mdRegistry = [];
  if (!chat || !Object.keys(chat.nodes).length) { box.innerHTML = emptyStateHTML(chat); return; }
  const kids = kidsMap(chat);
  const path = pathTo(chat, chat.leafId);
  const wide = path.some((n) => n.compare);
  let html = `<div class="thread ${wide ? 'wide' : ''}" id="thread">`;
  for (let i = 0; i < path.length; i++) {
    const n = path[i];
    if (n.role === 'user') {
      html += userMsgHTML(chat, n, kids);
      if (n.compare) {
        html += compareHTML(chat, n, kids, path[i + 1]);
        if (path[i + 1]?.parentId === n.id) {
          const nx = path[i + 1];
          if (nx.synth) html += asstMsgHTML(chat, nx, kids, i + 1 === path.length - 1);
          i++;
          if (nx.summary) html += summaryChip(nx);
        }
      }
    } else html += asstMsgHTML(chat, n, kids, i === path.length - 1);
    if (n.summary) html += summaryChip(n);
  }
  html += '</div>';
  const draft = S.ui.editing ? document.getElementById('edit-' + S.ui.editing)?.value : null;
  box.innerHTML = html;
  fillMarkdown(box);
  if (draft != null) { const t = document.getElementById('edit-' + S.ui.editing); if (t) t.value = draft; }
  updateJump();
}
function summaryChip(n) {
  return `<div class="summary-chip">${icon('layers', 'xs')} Contexte compacté jusqu'ici <button class="cb-btn" data-act="view-summary" data-id="${n.id}">voir le résumé</button></div>`;
}
function fillMarkdown(root) {
  for (const el of root.querySelectorAll('[data-mdi]')) {
    const r = mdRegistry[+el.dataset.mdi];
    if (!r) continue;
    const key = r.key;
    const cached = stepHtmlCache.get(key);
    if (cached && cached.src === r.src) el.innerHTML = cached.html;
    else {
      MD.render(el, r.src, { streaming: r.streaming });
      if (!el.querySelector('.mermaid-box')) {
        stepHtmlCache.set(key, { src: r.src, html: el.innerHTML });
        if (stepHtmlCache.size > 800) stepHtmlCache.delete(stepHtmlCache.keys().next().value);
      }
    }
    if (r.streaming) el.classList.add('cursor-blink');
  }
}
function mdSlot(key, src, streaming) {
  mdRegistry.push({ key, src, streaming });
  return `<div class="md" data-mdi="${mdRegistry.length - 1}"></div>`;
}
function siblingNav(chat, n, kids) {
  const sib = (kids[n.parentId || 'root'] || []).filter((x) => x.role === n.role && !(n.role === 'assistant' && chat.nodes[n.parentId]?.compare));
  if (sib.length < 2) return '';
  const i = sib.findIndex((x) => x.id === n.id);

async function addAttachments(files) {
  for (const f of files) {
    if (f.size > 30e6) { toast(`Fichier trop volumineux (max 30 Mo) : ${f.name}`, 'err'); continue; }
    const name = f.name || 'collé.png';
    const ext = (name.split('.').pop() || '').toLowerCase();
    try {
      let att;
      if (f.type.startsWith('image/')) {
        const data = await compressImage(await readFile(f, 'dataURL'));
        att = { kind: 'image', name, mime: f.type, data, size: data.length };
      } else if (ext === 'pdf' || f.type === 'application/pdf') {
        toast('Lecture du PDF…');
        const data = await readFile(f, 'dataURL');
        let text = null;
        try { text = await extractText(f); } catch (e) { console.warn(e); }
        att = { kind: 'pdf', name, data, text, size: f.size };
      } else if (f.type.startsWith('audio/')) {
        att = { kind: 'audio', name, data: await readFile(f, 'dataURL'), format: ext === 'wav' ? 'wav' : 'mp3', size: f.size };
      } else {
        const text = await extractText(f);
        att = { kind: 'text', name, text: text.length > 400000 ? text.slice(0, 400000) + '\n[… tronqué]' : text, size: f.size };
      }
      S.ui.attachments.push(att);
    } catch (e) { toast(`Impossible de lire ${name} : ${e.message}`, 'err'); }
  }
  renderAttachments();
  const chat = currentChat();
  const model = cfg(chat).model;
  if (S.ui.attachments.some((a) => a.kind === 'image') && S.models.length && !modelSupports(model, 'vision')) toast(`${modelShort(model)} ne lit pas les images : choisissez un modèle « vision ».`, 'err', 5000);
  $('#input')?.focus();
}
async function sendFromComposer(textOverride) {
  const inp = $('#input');
  const text = (textOverride ?? inp.value).trim();
  if (!text && !S.ui.attachments.length) return;
  if (!getApiKey()) { openOnboarding(); return; }
  const chat = ensureChat();
  if (chatBusy(chat)) { toast('Une réponse est déjà en cours dans cette conversation'); return; }
  if (text.startsWith('/') && !S.ui.attachments.length && await runSlashCommand(text)) { inp.value = ''; autoGrow(); saveDraft(); return; }
  const atts = S.ui.attachments;
  S.ui.attachments = [];
  renderAttachments();
  if (textOverride == null) { inp.value = ''; autoGrow(); updateTokHint(); localStorage.removeItem('cortex.draft'); }
  closeSlash();
  S.ui.stick = true;
  if (!col('chats').has(chat.id)) col('chats').set(chat.id, chat);
  await sendUserMessage(chat, text, atts);
}
function onInputKey(e) {
  if (slashKey(e)) return;
  if (e.key === 'Enter' && !e.isComposing) {
    const sendCombo = S.settings.sendKey === 'enter' ? !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey : (e.ctrlKey || e.metaKey);
    if (sendCombo || (S.settings.sendKey === 'enter' && (e.ctrlKey || e.metaKey))) { e.preventDefault(); sendFromComposer(); }

    const chat = currentChat();

/* ---------- Commandes slash & prompts ---------- */
const SLASH_CMDS = [
  { cmd: 'nouveau', desc: 'Nouvelle conversation', run: () => newChatView() },
  { cmd: 'compacter', desc: 'Compacter le contexte maintenant', run: () => compactNow() },
  { cmd: 'modele', desc: 'Changer de modèle', run: () => openModelPicker($('[data-act="pick-model"]')) },
  { cmd: 'agent', desc: "Changer d'agent", run: () => agentMenu($('[data-act="pick-agent"]')) },
  { cmd: 'outils', desc: 'Choisir les outils', run: () => openToolsPop($('[data-act="pick-tools"]')) },
  { cmd: 'exporter', desc: 'Exporter la conversation (Markdown)', run: () => currentChat() && exportChat(currentChat(), 'md') },
  { cmd: 'arene', desc: "Lancer l'arène à l'aveugle", run: () => startArena() },
  { cmd: 'python', desc: 'Réinitialiser l\'interpréteur Python', run: () => Sandbox.resetPy() },
];
let slashState = null;
function slashCheck() {
  const t = $('#input').value;
  const m = /^\/(\S*)$/.exec(t);
  if (!m) { closeSlash(); return; }
  const q = m[1];
  const prompts = [...col('prompts').values()].map((p) => ({ type: 'prompt', p, label: p.title, hint: '/' + (p.command || slugify(p.title)), score: fuzzyScore(q, (p.command || '') + ' ' + p.title + ' ' + (p.category || '')) }));
  const cmds = SLASH_CMDS.map((c) => ({ type: 'cmd', c, label: c.desc, hint: '/' + c.cmd, score: fuzzyScore(q, c.cmd + ' ' + c.desc) }));
  const items = [...cmds, ...prompts].filter((x) => x.score > 0).sort((a, b) => b.score - a.score).slice(0, 12);
  if (!items.length) { closeSlash(); return; }
  slashState = { items, i: 0 };
  drawSlash();
}
function drawSlash() {
  let el = $('#slashPop');
  if (!el) { el = document.createElement('div'); el.id = 'slashPop'; el.className = 'slash-pop'; $('#inputWrap').appendChild(el); }
  el.innerHTML = slashState.items.map((x, i) => `<div class="mrow ${i === slashState.i ? 'hl' : ''}" data-si="${i}">${icon(x.type === 'cmd' ? 'terminal' : 'book', 'sm')}<div class="grow"><div class="mn">${esc(x.label)}</div>${x.type === 'prompt' ? `<div class="md2">${esc(truncate(x.p.content, 90))}</div>` : ''}</div><span class="faint xs mono">${esc(x.hint)}</span></div>`).join('');
  el.onmousedown = (e) => { const r = e.target.closest('[data-si]'); if (r) { e.preventDefault(); slashState.i = +r.dataset.si; pickSlash(); } };
  el.querySelector('.hl')?.scrollIntoView({ block: 'nearest' });
}
function closeSlash() { slashState = null; $('#slashPop')?.remove(); }
function slashKey(e) {
  if (!slashState) return false;
  if (e.key === 'ArrowDown') { slashState.i = (slashState.i + 1) % slashState.items.length; drawSlash(); e.preventDefault(); return true; }
  if (e.key === 'ArrowUp') { slashState.i = (slashState.i - 1 + slashState.items.length) % slashState.items.length; drawSlash(); e.preventDefault(); return true; }
  if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pickSlash(); return true; }
  if (e.key === 'Escape') { closeSlash(); e.preventDefault(); return true; }
  return false;
}
function pickSlash() {
  const x = slashState?.items[slashState.i];
  closeSlash();
  if (!x) return;
  $('#input').value = '';
  autoGrow();
  if (x.type === 'cmd') x.c.run();
  else usePrompt(x.p);
}
async function runSlashCommand(text) {
  const name = text.slice(1).split(/\s/)[0];
  const c = SLASH_CMDS.find((x) => x.cmd === name);
  if (c) { c.run(); return true; }
  const p = [...col('prompts').values()].find((x) => x.command === name);
  if (p) { usePrompt(p); return true; }
  return false;
}
function promptVars(content) {
  const vars = [];
  content.replace(/\{\{\s*([\wÀ-ÿ-]+)(?:\|([^}]*))?\s*\}\}/g, (m, n, d) => { if (!vars.some((v) => v.name === n)) vars.push({ name: n, def: d || '' }); return m; });
  return vars.filter((v) => !['date', 'time', 'user_name', 'language', 'model'].includes(v.name));
}
async function usePrompt(p) {
  const vars = promptVars(p.content);
  let text = p.content;
  if (vars.length) {
    const vals = await new Promise((res) => {
      let done = false;
      const long = (n) => /texte|code|contenu|prompt|text/i.test(n);
      const m = openModal({
        title: esc(p.title), iconName: 'book',
        body: vars.map((v, i) => ui.field(esc(v.name.replace(/_/g, ' ')), long(v.name) ? `<textarea class="ta" data-var="${esc(v.name)}" ${i === 0 ? 'autofocus' : ''}>${esc(v.def)}</textarea>` : `<input class="inp" data-var="${esc(v.name)}" value="${esc(v.def)}" ${i === 0 ? 'autofocus' : ''}>`)).join(''),
        footer: `<button class="btn ghost" data-r="0">Annuler</button><button class="btn" data-r="2">Insérer</button><button class="btn primary" data-r="1">${icon('send', 'sm')} Envoyer</button>`,
        onClose: () => { if (!done) res(null); },
      });
      m.overlay.querySelectorAll('[data-r]').forEach((b) => b.addEventListener('click', () => {
        done = true;
        if (b.dataset.r === '0') { res(null); m.close(); return; }
        const o = {}; m.el.querySelectorAll('[data-var]').forEach((i) => { o[i.dataset.var] = i.value; });
        res({ vals: o, send: b.dataset.r === '1' }); m.close();
      }));
    });
    if (!vals) return;
    text = text.replace(/\{\{\s*([\wÀ-ÿ-]+)(?:\|([^}]*))?\s*\}\}/g, (m, n) => (n in vals.vals ? vals.vals[n] : m));
    text = fillVars(text);
    if (vals.send) { sendFromComposer(text); return; }
  } else text = fillVars(text);
  const inp = $('#input');
  inp.value = inp.value ? inp.value + '\n' + text : text;
  autoGrow(); updateTokHint();
  inp.focus();
}
function openPromptLib(anchor) {
  const prompts = [...col('prompts').values()].sort((a, b) => (a.category || '').localeCompare(b.category || '') || a.title.localeCompare(b.title));
  const el = showPop(anchor, `<div class="mp-head"><label class="search">${icon('search', 'sm')}<input id="plq" placeholder="Rechercher un prompt…" autocomplete="off"></label></div><div class="mp-list" id="pll"></div><div class="row" style="padding:8px;border-top:1px solid var(--border)"><button class="btn sm ghost" data-pl="manage">${icon('settings', 'sm')} Gérer les prompts</button></div>`, { cls: 'mp', side: 'top' });

      const h = p.category !== last ? `<div class="mh menu" style="position:static;box-shadow:none;border:0;padding:6px 10px 2px;animation:none">${esc(p.category || 'Divers')}</div>` : '';

function openModelPicker(anchor, { onPick, multi, initial, title } = {}) {
  const chat = currentChat();

  let sel = new Set(initial || (compareMode ? chat?.compare || [] : [cfg(chat).model]));

      ${title ? `<b class="small">${esc(title)}</b>` : ''}

      <div class="chips" id="mpt">${[['all', 'Tous'], ['fav', '★ Favoris'], ['recent', 'Récents'], ['free', 'Gratuits'], ['tools', 'Outils'], ['vision', 'Vision'], ['reasoning', 'Raisonnement'], ['image', 'Image']].map(([k, l]) => `<button class="chip ${k === tab ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div></div>
    <div class="mp-list" id="mpl"></div>
    ${compareMode ? `<div class="row" style="padding:10px;border-top:1px solid var(--border)"><span class="small muted grow" id="mpc"></span><button class="btn sm primary" id="mpok">Appliquer</button></div>` : ''}`, { cls: 'mp', side: 'top' });
  const draw = () => {
    const favs = new Set(S.settings.favorites);
    let list = S.models;
    if (tab === 'fav') list = list.filter((m) => favs.has(m.id));
    else if (tab === 'recent') list = S.settings.recentModels.map(getModel).filter(Boolean);
    else if (tab === 'free') list = list.filter(isFreeModel);
    else if (tab === 'tools') list = list.filter((m) => modelSupports(m.id, 'tools'));
    else if (tab === 'vision') list = list.filter((m) => modelSupports(m.id, 'vision'));
    else if (tab === 'reasoning') list = list.filter((m) => modelSupports(m.id, 'reasoning'));
    else if (tab === 'image') list = list.filter((m) => modelSupports(m.id, 'imageOut'));
    if (q) list = list.map((m) => ({ m, s: fuzzyScore(q, m.name + ' ' + m.id) })).filter((x) => x.s).sort((a, b) => b.s - a.s).map((x) => x.m);

function throttle(fn, ms) {
  let last = 0, t = null;
  return (...a) => {
    const n = now();
    clearTimeout(t);
    if (n - last >= ms) { last = n; fn(...a); }
    else t = setTimeout(() => { last = now(); fn(...a); }, ms - (n - last));
  };
}

function traceHTML(chat) {
  if (!chat?.runs?.length) return `<div class="empty-s">${icon('activity', 'lg')}<p>Aucune exécution pour l'instant.</p><p class="small">La trace détaille chaque appel au modèle et à un outil : durée, tokens, coût, requêtes et réponses brutes.</p></div>`;
  const runs = [...chat.runs].reverse();
  const total = chat.runs.reduce((a, r) => a + (r.cost || 0), 0);
  const toks = chat.runs.reduce((a, r) => a + (r.tokens?.prompt || 0) + (r.tokens?.completion || 0), 0);
  const evIcon = { llm: 'cpu', tool: 'wrench', hook: 'code', compact: 'layers', note: 'info', error: 'alert' };
  return `<div class="grid2" style="gap:8px;margin-bottom:12px"><div class="stat"><div class="k">Coût (traces)</div><div class="v" style="font-size:1.2em">${fmtCost(total, true)}</div></div><div class="stat"><div class="k">Tokens</div><div class="v" style="font-size:1.2em">${fmtTokens(toks)}</div></div></div>` +
    runs.map((r, i) => {
      const dur = (r.endedAt || now()) - r.startedAt;
      const open = S.ui.traceRun ? S.ui.traceRun === r.id : i === 0;
      const st = r.status === 'running' ? '<span class="spin"></span>' : r.status === 'error' ? `<span class="badge err">erreur</span>` : r.status === 'stopped' ? '<span class="badge warn">stop</span>' : `<span class="badge ok">${icon('check', 'xs')}</span>`;
      return `<details class="trace-run" ${open ? 'open' : ''}><summary>${st}<b class="ellipsis grow">${esc(modelShort(r.model))}</b><span class="faint xs">${fmtRel(r.startedAt)}</span><span class="xs">${fmtDur(dur)}</span><span class="xs">${fmtCost(r.cost, true)}</span></summary>
        ${r.events.map((e) => {
          const left = dur ? (e.t0 / dur) * 100 : 0;
          const w = dur ? Math.max(1, ((e.dur ?? (now() - r.startedAt - e.t0)) / dur) * 100) : 1;
          return `<div class="ev ${e.type}" data-act="trace-ev" data-run="${r.id}" data-ev="${e.id}"><span class="${e.type === 'error' || e.error ? 'faint' : 'muted'}">${icon(evIcon[e.type] || 'info', 'xs')}</span><div style="min-width:0"><div class="ellipsis" ${e.error ? 'style="color:var(--danger)"' : ''}>${esc(e.label)}${e.error ? ' — ' + esc(truncate(e.error, 80)) : ''}</div><div class="bar" style="margin-left:${clamp(left, 0, 99)}%;width:${clamp(w, 1, 100 - left)}%"></div></div><span class="faint xs" style="text-align:right">${e.dur != null ? fmtDur(e.dur) : '<span class="spin"></span>'}${e.tokens ? '<br>' + fmtTokens(e.tokens) + ' tok' : ''}${e.cost ? ' · ' + fmtCost(e.cost, true) : ''}</span></div>`;
        }).join('')}</details>`;
    }).join('');
}

/* ---------- Artefacts (aperçu en bac à sable) ---------- */
function openArtifact(a) {
  S.ui.artifact = a;
  S.ui.inspectorOpen = true;
  S.ui.inspectorTab = 'artifact';
  S.ui.artifactView = 'preview';
  renderInspector();

function artifactData(a) {
  if (!a) return null;
  if (a.path) {
    const f = readWorkspaceFile(a.path);
    if (!f) return null;
    const ext = (a.path.split('.').pop() || '').toLowerCase();
    const type = { html: 'html', htm: 'html', svg: 'svg', md: 'markdown', mmd: 'mermaid', png: 'image', jpg: 'image', jpeg: 'image', gif: 'image', webp: 'image' }[ext] || 'code';
    return { title: a.path, type, content: f.content, lang: langFromName(a.path), path: a.path };
  }
  return a;
}
function artifactDoc(d) {
  const dark = document.documentElement.dataset.theme === 'dark';
  const base = `<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">`;
  if (d.type === 'html') return /<html|<!doctype/i.test(d.content) ? d.content : `<!doctype html><html><head>${base}</head><body>${d.content}</body></html>`;
  if (d.type === 'svg') return `<!doctype html><html><head>${base}<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff}svg{max-width:100%;height:auto}</style></head><body>${d.content}</body></html>`;
  if (d.type === 'image') return `<!doctype html><html><head>${base}<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111}img{max-width:100%}</style></head><body><img src="${esc(d.content)}"></body></html>`;
  if (d.type === 'mermaid') return `<!doctype html><html><head>${base}<style>body{font-family:sans-serif;padding:20px;background:${dark ? '#0e1015' : '#fff'}}</style></head><body><pre class="mermaid">${esc(d.content)}</pre><script src="${LIBS.mermaid}"><\/script><script>mermaid.initialize({startOnLoad:true,theme:'${dark ? 'dark' : 'default'}'})<\/script></body></html>`;
  if (d.type === 'markdown' || d.type === 'md') return `<!doctype html><html><head>${base}<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css"><style>body{font-family:Inter,system-ui,sans-serif;max-width:780px;margin:30px auto;padding:0 20px;line-height:1.65;color:${dark ? '#e8eaef' : '#111827'};background:${dark ? '#0e1015' : '#fff'}}pre{background:${dark ? '#161920' : '#f6f8fa'};padding:12px;border-radius:10px;overflow:auto}table{border-collapse:collapse}td,th{border:1px solid #8884;padding:6px 10px}img{max-width:100%}a{color:#2563eb}</style></head><body>${MD.toHTML(d.content)}</body></html>`;
  return `<!doctype html><html><head>${base}<style>body{margin:0;background:${dark ? '#0b0d12' : '#f6f8fa'};color:${dark ? '#e8eaef' : '#111'}}pre{margin:0;padding:16px;font:13px/1.6 ui-monospace,monospace;white-space:pre-wrap}</style></head><body><pre>${esc(d.content)}</pre></body></html>`;
}
let lastArtifactKey = '';
function renderArtifact(body) {
  const d = artifactData(S.ui.artifact);
  if (!d) { body.innerHTML = `<div class="empty-s" style="padding:40px 20px">${icon('eye', 'lg')}<p>Aucun aperçu.</p><p class="small">Cliquez sur « Aperçu » sur un bloc de code HTML/SVG/Mermaid, ou demandez à un agent de créer un artefact (outil create_artifact).</p></div>`; lastArtifactKey = ''; return; }
  const view = S.ui.artifactView || 'preview';

  lastArtifactKey = key;
  body.innerHTML = `<div class="row" style="padding:8px 10px;border-bottom:1px solid var(--border);gap:4px;flex:none">
      <span class="ellipsis grow small" style="font-weight:600" title="${esc(d.title || '')}">${esc(d.title || 'Aperçu')}</span>
      <div class="seg"><button class="${view === 'preview' ? 'on' : ''}" data-act="art-view" data-v="preview">Aperçu</button><button class="${view === 'code' ? 'on' : ''}" data-act="art-view" data-v="code">Code</button></div>
      <button class="icon-btn sm" data-act="art-reload" title="Recharger">${icon('refresh', 'sm')}</button>
      <button class="icon-btn sm" data-act="art-tab" title="Ouvrir dans un nouvel onglet">${icon('ext', 'sm')}</button>
      <button class="icon-btn sm" data-act="art-full" title="Plein écran">${icon('max', 'sm')}</button>
      <button class="icon-btn sm" data-act="art-dl" title="Télécharger">${icon('download', 'sm')}</button>
      ${d.path ? '' : `<button class="icon-btn sm" data-act="art-save" title="Enregistrer dans les fichiers">${icon('save', 'sm')}</button>`}
    </div>
    ${view === 'code' ? `<div style="flex:1;overflow:auto"><div class="codeblock" style="margin:0;border:0;border-radius:0" data-lang="${esc(d.lang || d.type)}"><pre><code class="hljs">${MD.highlight(d.content, d.lang || (d.type === 'markdown' ? 'markdown' : d.type === 'svg' ? 'xml' : d.type), false)}</code></pre></div></div>`
      : `<iframe class="artifact-frame" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads allow-pointer-lock" title="Aperçu de l'artefact"></iframe>`}`;

function artifactAction(act, v) {
  const d = artifactData(S.ui.artifact);
  if (!d) return;
  if (act === 'art-view') { S.ui.artifactView = v; lastArtifactKey = ''; renderInspector(); }
  else if (act === 'art-reload') { lastArtifactKey = ''; renderInspector(); }
  else if (act === 'art-tab') { const url = URL.createObjectURL(new Blob([artifactDoc(d)], { type: 'text/html' })); window.open(url, '_blank'); setTimeout(() => URL.revokeObjectURL(url), 60000); }
  else if (act === 'art-dl') { const ext = { html: 'html', svg: 'svg', markdown: 'md', mermaid: 'mmd' }[d.type] || 'txt'; d.type === 'image' ? download(slugify(d.title) + '.png', dataURLtoBlob(d.content)) : download(slugify(d.title || 'artefact') + '.' + ext, d.content); }
  else if (act === 'art-save') { const ext = { html: 'html', svg: 'svg', markdown: 'md', mermaid: 'mmd' }[d.type] || 'txt'; const p = `artifacts/${slugify(d.title || 'apercu')}.${ext}`; writeWorkspaceFile(p, d.content); S.ui.artifact = { path: p }; toast('Enregistré : ' + p, 'ok'); lastArtifactKey = ''; renderInspector(); }
  else if (act === 'art-full') {
    const m = openModal({ title: esc(d.title || 'Aperçu'), iconName: 'eye', size: 'wide', flush: true, body: '<iframe class="artifact-frame" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads allow-pointer-lock" style="height:100%"></iframe>' });
    m.el.querySelector('iframe').srcdoc = artifactDoc(d);
  }
}

/* ---------- Éditeur de fichier ---------- */
function openFileEditor(path) {
  const f = readWorkspaceFile(path);
  if (!f) return toast('Fichier introuvable', 'err');
  const bin = f.encoding === 'base64';
  const isImg = /^data:image\//.test(f.content);
  const previewable = /\.(html?|svg|md|mmd)$/i.test(f.id) || isImg;
  const m = openModal({
    title: `<span class="mono" style="font-size:.9em">${esc(f.id)}</span>`, iconName: 'file', size: 'mid',
    body: bin ? (isImg ? `<img src="${esc(f.content)}" style="max-width:100%;border-radius:10px">` : `<div class="empty-s">Fichier binaire (${esc(f.mime)}, ${fmtBytes(f.size)}).</div>`)
      : `<textarea class="ta code" id="fe-ta" style="min-height:52vh" spellcheck="false">${esc(f.content)}</textarea><div class="faint xs" style="margin-top:6px">${f.content.split('\n').length} lignes · modifié ${fmtRel(f.updatedAt)}</div>`,
    footer: `<button class="btn danger" data-fe="del">${icon('trash', 'sm')} Supprimer</button><span class="grow"></span>
      <button class="btn" data-fe="rename">${icon('edit', 'sm')} Renommer</button>
      ${previewable ? `<button class="btn" data-fe="preview">${icon('eye', 'sm')} Aperçu</button>` : ''}
      <button class="btn" data-fe="dl">${icon('download', 'sm')}</button>
      ${bin ? '' : `<button class="btn primary" data-fe="save">${icon('save', 'sm')} Enregistrer</button>`}`,
  });
  m.overlay.querySelector('.modal-f').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-fe]');
    if (!b) return;
    const a = b.dataset.fe;
    if (a === 'save') { writeWorkspaceFile(f.id, $('#fe-ta').value); toast('Enregistré', 'ok'); m.close(); }
    if (a === 'dl') bin ? download(f.id.split('/').pop(), dataURLtoBlob(f.content)) : download(f.id.split('/').pop(), $('#fe-ta')?.value ?? f.content, f.mime);
    if (a === 'preview') { if (!bin) writeWorkspaceFile(f.id, $('#fe-ta').value); m.close(); openArtifact({ path: f.id }); }
    if (a === 'del') { if (await confirmDialog(`Supprimer ${esc(f.id)} ?`, { danger: true, ok: 'Supprimer' })) { deleteWorkspaceFile(f.id); m.close(); } }
    if (a === 'rename') {
      const np = await promptDialog('Renommer / déplacer', f.id);
      if (np && normPath(np) && normPath(np) !== f.id) { const content = bin ? f.content : $('#fe-ta').value; deleteWorkspaceFile(f.id); writeWorkspaceFile(np, content, f.encoding); m.close(); }
    }
  });
}
async function newFileDialog() {
  const p = await promptDialog('Nouveau fichier', '', { placeholder: 'dossier/nom.ext' });
  if (!p || !normPath(p)) return;
  if (readWorkspaceFile(p)) return toast('Ce fichier existe déjà', 'err');
  writeWorkspaceFile(p, '');
  openFileEditor(p);
}
function uploadToWorkspace() {
  pickFiles(async (files) => {
    for (const f of files) {
      if (f.size > 20e6) { toast('Trop volumineux : ' + f.name, 'err'); continue; }
      if (isTextLikeName(f.name) || f.type.startsWith('text/')) writeWorkspaceFile('uploads/' + f.name, await readFile(f, 'text'));
      else writeWorkspaceFile('uploads/' + f.name, await readFile(f, 'dataURL'), 'base64');
    }
    toast(`${files.length} fichier(s) ajouté(s) dans uploads/`, 'ok');
  });
}
function pickFiles(cb, accept = '') {
  const inp = $('#filePick');
  inp.value = '';
  inp.accept = accept;
  inp.onchange = () => { if (inp.files.length) cb([...inp.files]); };
  inp.click();
}
async function downloadWorkspaceZip() {
  const files = [...col('files').values()];
  if (!files.length) return toast('Aucun fichier');
  try {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    const zip = new JSZip();
    for (const f of files) zip.file(f.id, f.encoding === 'base64' ? dataURLtoBlob(f.content) : f.content);
    download('cortex-fichiers.zip', await zip.generateAsync({ type: 'blob' }));
  } catch (e) { toast('Archive impossible : ' + e.message, 'err'); }
}

      <button class="btn sm ${emb < chunks ? 'primary' : ''}" data-k="embed" ${chunks && emb < chunks ? '' : 'disabled'} title="Calcule les embeddings via OpenRouter pour une recherche sémantique">${icon('sparkles', 'sm')} Vectoriser (${chunks - emb})</button></div>
    <div class="card" style="margin-bottom:14px"><div class="row"><label class="search">${icon('search', 'sm')}<input id="kbq" placeholder="Tester une recherche dans cette collection…"></label><button class="btn sm" data-k="search">Chercher</button></div><div id="kbres"></div></div>
    <table class="tbl"><thead><tr><th>Document</th><th>Taille</th><th>Segments</th><th>Ajouté</th><th></th></tr></thead><tbody>${docs.map((d) => `<tr><td><div class="row">${icon('file', 'sm')}<span class="ellipsis" style="max-width:340px">${esc(d.name)}</span></div></td><td>${fmtBytes(d.size)}</td><td>${d.chunks.length}${d.chunks.every((c) => c.emb) ? ' <span class="badge ok">vec</span>' : ''}</td><td class="small muted">${fmtRel(d.createdAt)}</td><td style="white-space:nowrap"><button class="icon-btn sm" data-k="view" data-id="${d.id}" title="Voir">${icon('eye', 'sm')}</button><button class="icon-btn sm" data-k="deldoc" data-id="${d.id}" title="Supprimer">${icon('trash', 'sm')}</button></td></tr>`).join('') || '<tr><td colspan="5" class="empty-s">Collection vide</td></tr>'}</tbody></table>`;
  const drop = main.querySelector('#kbDrop');
  const ingest = async (files) => {
    for (const f of files) {
      drop.innerHTML = `<span class="spin"></span> Lecture de ${esc(f.name)}…`;
      try { const text = await extractText(f); if (!text.trim()) throw new Error('aucun texte extrait'); await KB.addDoc(kc.id, f.name, text); }
      catch (e) { toast(`${f.name} : ${e.message}`, 'err', 5000); }
    }
    toast('Documents ajoutés', 'ok');
    renderPage();
  };
  drop.onclick = () => pickFiles(ingest);
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files.length) ingest([...e.dataTransfer.files]); };
  const doSearch = async () => {
    const q = $('#kbq').value.trim();
    if (!q) return;
    const box = $('#kbres');
    box.innerHTML = '<span class="spin"></span>';
    const res = await KB.search(q, { colIds: [kc.id], k: 5 });
    box.innerHTML = res.map((r) => `<div class="note" style="margin-top:8px"><div class="row xs muted"><b>${esc(r.doc.docName)}</b> · segment ${r.doc.idx + 1}<span class="grow"></span>${r.sim != null ? `sim ${r.sim.toFixed(3)}` : ''}${r.lex != null ? ` · bm25 ${r.lex.toFixed(2)}` : ''}</div><div class="small" style="white-space:pre-wrap;margin-top:4px">${esc(truncate(r.doc.text, 500))}</div></div>`).join('') || '<div class="small muted" style="margin-top:8px">Aucun résultat.</div>';
  };
  main.querySelector('#kbq').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
  main.onclick = async (e) => {
    const el = e.target.closest('[data-k]');
    if (!el) return;
    const d = col('kbdocs').get(el.dataset.id);
    switch (el.dataset.k) {
      case 'search': doSearch(); break;
      case 'text': { const t = await promptDialog('Coller du texte', '', { multiline: true, placeholder: 'Votre texte…' }); if (t?.trim()) { const name = await promptDialog('Nom du document', 'Note ' + new Date().toLocaleDateString('fr-FR')); await KB.addDoc(kc.id, name || 'Note', t); renderPage(); } break; }
      case 'url': {
        const u = await promptDialog('Importer une page web', 'https://', { placeholder: 'https://…' });
        if (!u || u === 'https://') return;
        toast('Téléchargement…');
        try { const txt = await TOOLS.get('fetch_url').run({ url: u, max_chars: 400000 }, { signal: null }); await KB.addDoc(kc.id, u, txt, { url: u }); renderPage(); toast('Page importée', 'ok'); }
        catch (err) { toast(err.message, 'err', 6000); }
        break;
      }
      case 'embed': {
        if (!getApiKey()) return openOnboarding();
        const todo = [...col('kbdocs').values()].filter((x) => x.colId === kc.id).reduce((a, x) => a + x.chunks.filter((c) => !c.emb).reduce((s, c) => s + c.text.length, 0), 0);
        if (!(await confirmDialog(`Vectoriser ~${fmtTokens(estTokens('x'.repeat(Math.min(todo, 1e8))))} tokens avec <code>${esc(S.settings.embeddingModel)}</code> ? Coût estimé : très faible (~0,02 $ / million de tokens pour text-embedding-3-small).`, { ok: 'Vectoriser' }))) return;
        el.innerHTML = '<span class="spin"></span>';
        try { const n = await KB.embedCollection(kc.id, (i, t) => { el.innerHTML = `<span class="spin"></span> ${i}/${t}`; }); toast(n + ' segments vectorisés', 'ok'); }
        catch (err) { toast('Vectorisation : ' + err.message, 'err', 6000); }
        renderPage(); break;
      }
      case 'view': openModal({ title: esc(d.name), iconName: 'file', size: 'mid', body: d.chunks.map((c, i) => `<div class="note" style="margin-bottom:8px"><div class="xs faint">Segment ${i + 1}${c.emb ? ' · vectorisé' : ''}</div><div class="small" style="white-space:pre-wrap">${esc(c.text)}</div></div>`).join('') }); break;
      case 'deldoc': if (await confirmDialog(`Supprimer « ${esc(d.name)} » ?`, { danger: true, ok: 'Supprimer' })) { col('kbdocs').delete(d.id); DB.del('kbdocs', d.id); renderPage(); } break;
      case 'rename': { const n = await promptDialog('Renommer la collection', kc.name); if (n?.trim()) { kc.name = n.trim(); persist('kbcols', kc); renderPage(); } break; }
      case 'delete':
        if (await confirmDialog(`Supprimer la collection « ${esc(kc.name)} » et ses ${col('kbdocs').size ? 'documents' : ''} ?`, { danger: true, ok: 'Supprimer' })) {
          for (const x of [...col('kbdocs').values()]) if (x.colId === kc.id) { col('kbdocs').delete(x.id); DB.del('kbdocs', x.id); }
          col('kbcols').delete(kc.id); DB.del('kbcols', kc.id); S.ui.kbSel = null; renderPage();
        }
        break;
      case 'attach': {
        const chat = ensureChat();
        const set = new Set(cfg(chat).kb);
        set.add(kc.id); chat.kb = [...set];
        if (Object.keys(chat.nodes).length) saveChat(chat);
        renderModelBar();
        toast(`« ${kc.name} » attachée à la conversation : ses extraits pertinents seront injectés automatiquement`, 'ok', 4500);
        break;
      }
    }
  };
}

/* ---------------- Export / import ---------------- */
async function exportAll(withKey) {
  const out = { app: 'cortex-studio', version: APP_VERSION, exportedAt: new Date().toISOString(), settings: S.settings };
  for (const s of STORES) if (s !== 'kv') out[s] = [...col(s).values()];
  if (withKey) out.apiKey = getApiKey();
  download(`cortex-sauvegarde-${dayKey(now())}.json`, JSON.stringify(out), 'application/json');
}
async function importData(file) {
  const j = JSON.parse(await readFile(file));
  let n = 0;
  if (j.app === 'cortex-studio') {
    for (const s of STORES) {
      if (s === 'kv' || !Array.isArray(j[s])) continue;
      for (const o of j[s]) { if (!o?.id) continue; col(s).set(o.id, o); n++; }
      await DB.bulkPut(s, j[s].filter((o) => o?.id));
    }
    if (j.settings) { S.settings = mergeSettings(j.settings); saveSettings(); applyTheme(); }
    if (j.apiKey && !getApiKey()) setApiKey(j.apiKey);
    return n;
  }
  const chats = [];
  const conv = Array.isArray(j) ? j : Array.isArray(j.conversations) ? j.conversations : null;
  if (conv && conv[0]?.mapping) {
    for (const c of conv) {
      const msgs = [];
      let id = c.current_node;
      const seen = new Set();
      while (id && c.mapping[id] && !seen.has(id)) {
        seen.add(id);
        const msg = c.mapping[id].message;
        const role = msg?.author?.role;
        const parts = (msg?.content?.parts || []).filter((p) => typeof p === 'string');
        if ((role === 'user' || role === 'assistant') && parts.join('').trim()) msgs.unshift({ role, content: parts.join('\n'), ts: (msg.create_time || c.create_time || 0) * 1000 });
        id = c.mapping[id].parent;
      }
      chats.push({ title: c.title, ts: (c.create_time || 0) * 1000, msgs, model: c.default_model_slug });
    }
  } else {
    const tm = j.data?.chats || j.chats || (Array.isArray(j) ? j : null);
    if (!Array.isArray(tm)) throw new Error('Format non reconnu');
    for (const c of tm) {
      const msgs = (c.messages || []).filter((x) => x && (x.role === 'user' || x.role === 'assistant')).map((x) => ({ role: x.role, content: typeof x.content === 'string' ? x.content : Array.isArray(x.content) ? x.content.map((p) => p.text || '').join('\n') : '', ts: Date.parse(x.createdAt) || 0 }));
      chats.push({ title: c.chatTitle || c.title || 'Conversation importée', ts: Date.parse(c.createdAt || c.updatedAt) || now(), msgs, model: c.model });
    }
  }
  for (const c of chats) {
    if (!c.msgs.length) continue;
    const chat = createChat({ agentId: null });
    chat.title = c.title || 'Conversation importée';
    chat.createdAt = c.ts || now();
    let prev = null, t = chat.createdAt;
    for (const m of c.msgs) {
      const id = uid('n');
      t = Math.max(t + 1, m.ts || 0);
      chat.nodes[id] = m.role === 'user' ? { id, parentId: prev, role: 'user', content: m.content, createdAt: t } : { id, parentId: prev, role: 'assistant', model: c.model || 'importé', steps: [{ id: uid('s'), content: m.content, toolCalls: [], status: 'done' }], status: 'done', createdAt: t };
      prev = id;
    }
    chat.leafId = prev;
    chat.tags = ['importé'];
    chat.updatedAt = t;
    await DB.put('chats', chat);
    n++;
  }
  return n;
}
function mergeSettings(saved) {
  const d = deepClone(DEFAULT_SETTINGS);
  const out = { ...d, ...saved };
  for (const k of ['params', 'harness', 'provider', 'tts', 'hooks']) out[k] = { ...d[k], ...(saved?.[k] || {}) };
  out.toolPerms = { ...(saved?.toolPerms || {}) };
  out.elo = { ...(saved?.elo || {}) };
  out.folderClosed = { ...(saved?.folderClosed || {}) };
  out.id = 'settings';
  return out;
}

function openPalette() {
  if ($('.palette')) return;
  closePop();
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.style.alignItems = 'flex-start';
  ov.innerHTML = `<div class="pop palette" style="position:relative"><input placeholder="Commande, conversation, modèle, agent…" autocomplete="off"><div class="pl"></div></div>`;
  document.body.appendChild(ov);
  const inp = ov.querySelector('input'), pl = ov.querySelector('.pl');
  let items = [], hl = 0;
  const close = () => ov.remove();
  const draw = () => {
    const q = inp.value.trim();
    const cmds = paletteCommands().map((c) => ({ ...c, kind: 'Commandes', s: fuzzyScore(q, c.label) }));
    const chats = [...col('chats').values()].filter((c) => Object.keys(c.nodes).length).map((c) => ({ label: c.title, icon: 'chat', hint: fmtRel(c.updatedAt), kind: 'Conversations', s: q ? fuzzyScore(q, c.title) : 0, run: () => openChat(c.id) }));
    const models = q.length > 1 ? S.models.map((m) => ({ label: m.name, kind: 'Modèles', logo: m.id, hint: isFreeModel(m) ? 'gratuit' : '', s: fuzzyScore(q, m.name + ' ' + m.id) * 0.8, run: () => setChatModel(m.id) })) : [];
    items = [...cmds.filter((x) => x.s > 0).sort((a, b) => b.s - a.s).slice(0, q ? 8 : 12), ...chats.filter((x) => q ? x.s > 0 : true).sort((a, b) => b.s - a.s).slice(0, q ? 8 : 6), ...models.filter((x) => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 6)];
    hl = clamp(hl, 0, Math.max(0, items.length - 1));
    let last = '';
    pl.innerHTML = items.map((x, i) => { const h = x.kind !== last ? `<div class="mh menu" style="position:static;box-shadow:none;border:0;padding:8px 10px 2px;animation:none">${x.kind}</div>` : ''; last = x.kind; return h + `<div class="mrow ${i === hl ? 'hl' : ''}" data-pi="${i}">${x.logo ? modelLogo(x.logo, 22) : x.emoji ? `<span style="width:20px;text-align:center">${esc(x.emoji)}</span>` : icon(x.icon || 'cmd', 'sm')}<span class="grow ellipsis">${esc(x.label)}</span>${x.hint ? `<span class="faint xs">${esc(x.hint)}</span>` : ''}</div>`; }).join('') || '<div class="empty-s">Aucun résultat</div>';
    pl.querySelector('.hl')?.scrollIntoView({ block: 'nearest' });
  };
  const pick = (i) => { const x = items[i]; if (!x) return; close(); x.run(); };
  inp.addEventListener('input', () => { hl = 0; draw(); });
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { hl = (hl + 1) % Math.max(1, items.length); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { hl = (hl - 1 + items.length) % Math.max(1, items.length); draw(); e.preventDefault(); }
    else if (e.key === 'Enter') { pick(hl); e.preventDefault(); }
    else if (e.key === 'Escape') { close(); e.stopPropagation(); }
  });
  pl.addEventListener('click', (e) => { const r = e.target.closest('[data-pi]'); if (r) pick(+r.dataset.pi); });
  ov.addEventListener('mousedown', (e) => { if (e.target === ov) close(); });
  draw();
  inp.focus();
}

/* Raccourcis clavier */
document.addEventListener('keydown', (e) => {
  const mod = e.ctrlKey || e.metaKey;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'o') { e.preventDefault(); newChatView(); return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === 's') { e.preventDefault(); $('#app').classList.toggle('side-collapsed'); renderHeader(); return; }
  if (mod && e.key === '.') { e.preventDefault(); toggleInspector(); return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'c') {
    const chat = currentChat();
    const last = chat && [...pathTo(chat, chat.leafId)].reverse().find((n) => n.role === 'assistant');
    if (last) { e.preventDefault(); copyText(nodeText(last)); }
    return;
  }
  if (e.altKey && e.key.toLowerCase() === 'r' && !mod) {
    const chat = currentChat();
    const last = chat && [...pathTo(chat, chat.leafId)].reverse().find((n) => n.role === 'assistant');
    if (last) { e.preventDefault(); regenerate(last.id); }
    return;
  }
  if (e.key === 'Escape') {
    if ($('.lightbox')) { $('.lightbox').remove(); return; }
    if (openPop) { closePop(); return; }
    if (modalStack.length) { modalStack[modalStack.length - 1].close(); return; }
    if (S.ui.editing) { S.ui.editing = null; renderMessages(); return; }
    const chat = currentChat();
    if (chat && chatBusy(chat)) { stopChat(chat); toast('Génération arrêtée'); }
    return;
  }
  if (e.key === '/' && !typing && !mod && !modalStack.length) { e.preventDefault(); $('#input')?.focus(); }
});
window.addEventListener('unhandledrejection', (e) => {

  console.error(r);
});

async function boot() {
  Sandbox.init();
  MD.init();
  await DB.open();
  const all = await Promise.all(STORES.map((s) => DB.all(s).catch(() => [])));
  const kv = all[0] || [];
  S.settings = mergeSettings(kv.find((x) => x.id === 'settings') || {});
  const cache = kv.find((x) => x.id === 'models');
  if (cache?.data?.length) setModels(cache.data, cache.ts);
  STORES.forEach((s, i) => { if (s !== 'kv') S.col[s] = new Map((all[i] || []).map((o) => [o.id, o])); });
  // Agents et prompts intégrés
  for (const a of BUILTIN_AGENTS) if (!col('agents').has(a.id)) { const c = deepClone(a); col('agents').set(c.id, c); persist('agents', c); }
  if (!S.settings.seededPrompts) {
    for (const p of BUILTIN_PROMPTS) if (!col('prompts').has(p.id)) { col('prompts').set(p.id, { ...p }); persist('prompts', { ...p }); }
    S.settings.seededPrompts = true;
    saveSettings();
  }
  // Réponses interrompues par un rechargement
  for (const c of col('chats').values()) {
    let dirty = false;
    for (const n of Object.values(c.nodes)) if (n.status === 'running') { n.status = 'stopped'; dirty = true; for (const s of n.steps || []) { if (s.status === 'streaming') s.status = 'stopped'; for (const t of s.toolCalls || []) if (t.result == null) { t.status = 'stopped'; t.result = 'Interrompu (page rechargée).'; } } }
    for (const r of c.runs || []) if (r.status === 'running') { r.status = 'stopped'; r.endedAt = r.endedAt || r.startedAt; dirty = true; }
    if (dirty) persist('chats', c);
  }
  applyTheme();
  renderRail();
  renderSidebar();
  renderComposer();
  renderAttachments();
  $('#jumpBtn').innerHTML = icon('down');
  $('#messages').addEventListener('scroll', () => {
    const box = $('#messages');
    S.ui.stick = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    updateJump();
  }, { passive: true });
  await OAuth.finish();
  const last = localStorage.getItem('cortex.lastChat');
  if (last && col('chats').has(last) && Object.keys(col('chats').get(last).nodes).length) openChat(last);
  else newChatView();
  if (!window.marked || !window.DOMPurify) toast('Bibliothèques d\'affichage non chargées (hors ligne ?) : rendu simplifié.', 'err', 6000);
  OR.loadModels().then(() => {
    renderModelBar(); renderHeader();
    const c = currentChat();
    if (c && !Object.keys(c.nodes).length) renderMessages();
    if (S.ui.page === 'models') renderPage();
  }).catch((e) => toast('Catalogue des modèles indisponible : ' + e.message, 'err', 5000));
  if (!getApiKey()) openOnboarding();
  if ('speechSynthesis' in window) speechSynthesis.getVoices();
}
boot();

</script>
</body>
</html>
