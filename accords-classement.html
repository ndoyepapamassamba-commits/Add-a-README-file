<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accords de Classement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : bandeau marine (logo + titre + date) → héros encours total + barre de répartition → 3 segments → navigation détails */
:root{
  --marine:#00415E; --eco:#005C83; --sky:#1A86B3; --lime:#8CC63F; --lime2:#A6D867;
  --bg:#EEF4F7; --surface:#FFFFFF; --line:#CFE0E7; --fg:#12333F; --muted:#3E5C6B; --zebra:#F6FAFC;
  --corp:#2E9E5B; --sfd:#D4A13A; --part:#C0392B; --port:#00415E;
  --sh:0 1px 2px rgba(0,65,94,.08),0 10px 30px -12px rgba(0,65,94,.28);
  --display:"Sora","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",Consolas,ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071C26; --surface:#0D2A38; --line:#1D4456; --fg:#E4F0F5; --muted:#9DBCCB; --zebra:#0B2431;
  --corp:#4CC07D; --sfd:#E6B65A; --part:#E5645A; --port:#5FB4DB;
  --sh:0 1px 2px rgba(0,0,0,.3),0 12px 32px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071C26; --surface:#0D2A38; --line:#1D4456; --fg:#E4F0F5; --muted:#9DBCCB; --zebra:#0B2431;
  --corp:#4CC07D; --sfd:#E6B65A; --part:#E5645A; --port:#5FB4DB;
  --sh:0 1px 2px rgba(0,0,0,.3),0 12px 32px -14px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 40px;display:grid;gap:20px}

/* ---------- Bandeau ---------- */
.band{position:relative;overflow:hidden;border-radius:18px;color:#fff;
  background:linear-gradient(120deg,#00415E 0%,#005C83 62%,#0A6F95 100%);box-shadow:var(--sh)}
.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--lime),var(--lime2))}
.band .arc{position:absolute;right:-120px;top:-180px;width:560px;height:420px;border-radius:50%;
  border-top:26px solid rgba(255,255,255,.07);transform:rotate(-14deg);pointer-events:none}
.band-in{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:18px 28px;padding:22px 26px 24px}
.logo{display:flex;align-items:center;background:#005C83;border-radius:12px;padding:6px 10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 16px -6px rgba(0,0,0,.45)}
.logo img{height:64px;width:auto;display:block}
.ttl{flex:1 1 280px;min-width:0}
.eyebrow{font:600 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--lime2)}
.ttl h1{margin:6px 0 2px;font:800 clamp(24px,3.4vw,36px)/1.1 var(--display);letter-spacing:-.01em;text-wrap:balance}
.ttl p{margin:0;color:rgba(255,255,255,.75);font-size:13.5px}
.meta{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 14px;backdrop-filter:blur(4px)}
.chip small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.chip b{font:600 17px/1.3 var(--mono)}
.logo.bceao{background:#fff;padding:5px 10px}
.logo.bceao img{height:64px}
.refresh{display:grid;place-items:center;width:54px;min-height:50px;border-radius:12px;border:1px solid rgba(255,255,255,.25);
  background:linear-gradient(160deg,#A6D867,#6BA23A);color:#fff;cursor:pointer;box-shadow:0 6px 14px -6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.4)}
.refresh:hover{filter:brightness(1.06)}
.refresh:focus-visible,.nav button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.refresh svg{width:24px;height:24px;transition:transform .7s ease}
.refresh.spin svg{transform:rotate(360deg)}

/* ---------- Héros ---------- */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:24px 26px;display:grid;gap:18px}
.hero-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.lbl{font:600 11.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.big{font:800 clamp(34px,6.4vw,64px)/1.05 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--fg);margin-top:8px;white-space:nowrap}
.big span{font:600 .32em var(--mono);color:var(--muted);letter-spacing:0;margin-left:.4em}
.mix{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--zebra);border:1px solid var(--line)}
.mix i{display:block;height:100%;transition:filter .2s}
.mix i:hover{filter:brightness(1.1)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend em{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{color:var(--fg);font:600 13px var(--mono)}

/* ---------- Segments ---------- */
.segs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.seg{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:18px 20px 16px;position:relative;overflow:hidden;display:grid;gap:10px}
.seg::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c)}
.seg header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font:700 11.5px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.pct{font:600 12.5px/1 var(--mono);color:var(--fg);background:var(--zebra);border:1px solid var(--line);padding:5px 8px;border-radius:999px}
.amt{font:700 clamp(22px,2.6vw,28px)/1.1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.amt small{font:500 12px var(--mono);color:var(--muted);margin-left:6px}
.bar{height:6px;border-radius:999px;background:var(--zebra);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:inherit}
.seg p{margin:0;font-size:12.5px;color:var(--muted)}

/* ---------- Navigation ---------- */
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.nav button{font:600 14px/1.2 var(--display);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-radius:14px;
  background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:var(--sh);
  border-bottom:3px solid var(--c);transition:transform .15s,background .15s}
.nav button:hover{transform:translateY(-2px);background:var(--zebra)}
.nav button[aria-pressed="true"]{background:var(--c);color:#fff;border-color:var(--c)}
.nav button svg{width:18px;height:18px;flex:none}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);padding-top:4px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--marine);color:#fff;
  padding:10px 16px;border-radius:10px;font-size:13.5px;border-bottom:3px solid var(--lime);box-shadow:var(--sh)}

@media (max-width:860px){.segs{grid-template-columns:1fr}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.band-in{padding:18px}.hero{padding:20px 18px}.nav button{font-size:12.5px;padding:13px 12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="toast" id="toast" hidden></div>

<script>
const SEGS=[
  {key:"corp",nom:"Corporate",nav:"Détails Corporate",amt:2595548507,c:"var(--corp)",desc:"Grandes entreprises et PME"},
  {key:"sfd",nom:"SFD",nav:"Détails SFD",amt:2778851721,c:"var(--sfd)",desc:"Systèmes financiers décentralisés"},
  {key:"part",nom:"Particuliers",nav:"Détails Particuliers",amt:8789614037,c:"var(--part)",desc:"Clientèle des particuliers"}
];
const fmt=n=>Math.round(n).toLocaleString("fr-FR").replace(/[  ]/g," ");
const pct=n=>(n*100).toLocaleString("fr-FR",{minimumFractionDigits:1,maximumFractionDigits:1})+" %";
const total=SEGS.reduce((s,x)=>s+x.amt,0);
const $=id=>document.getElementById(id);

$("total").innerHTML=fmt(total)+"<span>XOF</span>";
$("mix").innerHTML=SEGS.map(s=>`<i style="width:${s.amt/total*100}%;background:${s.c}" title="${s.nom} : ${fmt(s.amt)} XOF"></i>`).join("");
$("legend").innerHTML=SEGS.map(s=>`<span><em style="background:${s.c}"></em>${s.nom} <b>${pct(s.amt/total)}</b></span>`).join("");
$("segs").innerHTML=SEGS.map(s=>`
  <article class="seg" style="--c:${s.c}">
    <header><span class="tag">Encours ${s.nom}</span><span class="pct">${pct(s.amt/total)}</span></header>
    <div class="amt">${fmt(s.amt)}<small>XOF</small></div>
    <div class="bar"><i style="width:${s.amt/total*100}%"></i></div>
    <p>${s.desc}</p>
  </article>`).join("");

const NAV=[...SEGS.map(s=>({label:s.nav,c:s.c})),{label:"Portfolio",c:"var(--port)"}];
const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
$("nav").innerHTML=NAV.map((n,i)=>`<button type="button" id="nav${i}" aria-pressed="false" style="--c:${n.c}">${n.label}${arrow}</button>`).join("");
let tt;
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}
$("nav").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  $("nav").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  toast("Ouverture : "+b.textContent.trim());
});
$("refresh").addEventListener("click",function(){
  this.classList.remove("spin");void this.offsetWidth;this.classList.add("spin");
  toast("Données à jour au "+$("date").textContent);
});
</script>
