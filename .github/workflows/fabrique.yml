# FABRIQUE MASSAMBA SUR GITHUB (20/10/2026) — « Je veux qu'elle soit indépendante de la machine Claude » ;
# « je ne veux pas me limiter à 3 vidéos, jusqu'à 5 et 6 par jour ».
# Production sur les machines gratuites de GitHub Actions (dépôt public : minutes illimitées ; mesuré le 20/10/2026 : 4 processeurs,
# 15 Go de mémoire, 86 Go de disque libre, paquets du moteur installés en 50 s), dans le compte de l'utilisateur.
# Rien de privé n'est posé en clair : bibliothèque, modèles dérivés, vidéos et fiches sont scellés (studio-video/fabrique/coffre.py)
# avec la phrase FABRIQUE_CLE rangée dans les secrets du dépôt. Données scellées : branche « fabrique-donnees » (lue par
# l'application https://<compte>.github.io/<dépôt>/fabrique/ via raw.githubusercontent.com) ; coffre et archives : releases.
# Une seule tâche, toutes les heures, qui fait ce qu'il y a à faire et s'arrête vite sinon :
#   1. pas de clé publiée → crée la paire de clés depuis la phrase (si le secret existe) ;
#   2. coffre absent → attend l'amorce (bibliothèque scellée versée par la machine de départ) ;
#   3. réserve de vidéos insuffisante → journée de production (autopilot.py jour), scellement, publication.
# 21/10/2026 — MOTEUR DE LA V1 (config.json « moteur »: « v1 ») : « si demain je ne suis pas autonome avec tout bouclé avec
# les 10000 vidéos j'arrêterai » ; « fabriqué d'avance à ma disposition ». La machine fabrique D'AVANCE à chaque marche
# (réserve de sketchs × scènes préparées de la troupe neuve, serie_v1.py), sans attendre qu'un créneau se libère ; le rendu
# des corps passe par EGL (Mesa) comme sur la machine de production ; paquets relevés par traçage d'un épisode complet.
name: Fabrique MASSAMBA
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      videos: { description: 'Vidéos par jour (1 à 6, vide = config.json)', default: '' }
  push:
    branches: [fabrique-amorce]
permissions: { contents: write, models: read }
concurrency: { group: fabrique, cancel-in-progress: false }
env:
  CODE: claude/relaxed-noether-svkgiu          # branche du moteur
  BIBLIO: ${{ github.workspace }}/../bibliotheque
  # 22/10/2026 : les modules lisent ~/.cache/massamba-models en dur (ambiance, rires, émojis, BEAT2, juge local…) — le coffre s'ouvre
  # au même endroit que sur la machine de production ; liste des modèles relevée par traçage d'un épisode à froid (1,5 Go)
  MASSAMBA_MODELS: /home/runner/.cache/massamba-models
jobs:
  amorce:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: fabrique-amorce }
      - name: Parts scellées → release fabrique-coffre
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view fabrique-coffre >/dev/null 2>&1 || gh release create fabrique-coffre --title "Coffre de la fabrique (chiffré)" --notes "Bibliothèque et modèles de la troupe, scellés : illisibles sans la phrase de la fabrique."
          gh release upload fabrique-coffre amorce/* --clobber
          gh release view fabrique-coffre --json assets --jq '.assets | length'

  fabrique:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.CODE }}' }
      - name: État de la fabrique
        id: etat
        env: { GH_TOKEN: '${{ github.token }}', PHRASE: '${{ secrets.FABRIQUE_CLE }}', INPUT_VIDEOS: '${{ inputs.videos }}' }
        run: |
          # données de l'application : branche fabrique-donnees ; à la toute première marche elle n'existe pas encore → dossier de
          # travail git vidé (et non un simple dossier : « fatal: not a git repository » à la publication des clés, 20/10/2026)
          if git fetch -q origin fabrique-donnees 2>/dev/null; then git worktree add -q ../site FETCH_HEAD
          else git worktree add -q --detach ../site HEAD && (cd ../site && git rm -rq . && git clean -fdq); fi
          if [ ! -f ../site/cle.priv.json ]; then
            if [ -z "$PHRASE" ]; then echo "faire=attendre-phrase" >> $GITHUB_OUTPUT; echo "Secret FABRIQUE_CLE absent : rien à faire."; exit 0; fi
            echo "faire=cles" >> $GITHUB_OUTPUT; exit 0
          fi
          if ! gh release view fabrique-coffre >/dev/null 2>&1; then echo "faire=attendre-amorce" >> $GITHUB_OUTPUT; echo "Coffre pas encore versé."; exit 0; fi
          python3 - <<'EOF' >> $GITHUB_OUTPUT
          import json, os, datetime
          p = '../site/etat-public.json'; E = json.load(open(p)) if os.path.isfile(p) else {}
          maintenant = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='minutes')
          a_venir = [c for c in E.get('creneaux_a_venir', []) if c > maintenant]
          C = json.load(open('studio-video/fabrique/config.json'))
          cadence = int(os.environ.get('INPUT_VIDEOS') or C['cadence'])
          avance = C.get('moteur') == 'v1'   # production d'avance : la réserve de vidéos n'a pas de plafond
          print('faire=' + ('produire' if avance or len(a_venir) < cadence or os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch' else 'rien'))
          EOF
      - uses: actions/setup-python@v5
        id: py
        if: steps.etat.outputs.faire == 'cles' || steps.etat.outputs.faire == 'produire'
        with: { python-version: '3.11' }
      # 22/10/2026 : l'installation des paquets du moteur prenait 21 min à chaque passage (marche n° 18) ; l'environnement entier
      # est gardé en cache, à la clé des versions (requirements.txt) et de l'interpréteur exact
      - name: Logiciels du moteur (cache)
        id: venv
        if: steps.etat.outputs.faire == 'produire'
        uses: actions/cache@v4
        with:
          path: ~/venv-fabrique
          key: venv-ubuntu-24.04-py${{ steps.py.outputs.python-version }}-${{ hashFiles('studio-video/fabrique/requirements.txt') }}
      - name: Paire de clés (la phrase reste dans les secrets)
        if: steps.etat.outputs.faire == 'cles'
        env: { FABRIQUE_CLE: '${{ secrets.FABRIQUE_CLE }}' }
        run: |
          pip install -q cryptography && python3 studio-video/fabrique/coffre.py cles ../site
          cd ../site && git checkout -q --orphan publie && git add -A && git -c user.name=fabrique -c user.email=fabrique@users.noreply.github.com commit -qm "Fabrique : clés" && git push -q -f origin publie:fabrique-donnees
      - name: Logiciels du moteur
        if: steps.etat.outputs.faire == 'produire'
        run: |
          # libgles2 : MediaPipe 1.1 (libmediapipe.so) est lié à libGLESv2.so.2 — sans lui, tourne.py s'arrête au chargement
          # (« OSError: libGLESv2.so.2 », marche n° 18, 22/10/2026) ; libgl1 : contexte EGL de ModernGL (rig2d.gl_actif)
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libegl-mesa0 libgl1-mesa-dri libgles2 libgl1 > /dev/null
          if [ ! -x ~/venv-fabrique/bin/python3 ]; then
            python3 -m venv ~/venv-fabrique && ~/venv-fabrique/bin/pip install -q -r studio-video/fabrique/requirements.txt
          fi
          echo "$HOME/venv-fabrique/bin" >> "$GITHUB_PATH"
          # contrôle avant la journée : la bibliothèque native de MediaPipe se charge (sinon arrêt ici, pas trois épisodes perdus)
          ~/venv-fabrique/bin/python3 -c "from mediapipe.tasks.python.core import mediapipe_c_bindings as b; b.load_raw_library(); import skia, cv2; print('moteur : MediaPipe, Skia, OpenCV chargés')"
          ~/venv-fabrique/bin/python3 -c "import moderngl; moderngl.create_standalone_context(backend='egl'); print('rendu : EGL actif')" || echo "rendu : EGL absent, chemin processeur"
      - name: Ouvrir le coffre (bibliothèque, modèles, état)
        if: steps.etat.outputs.faire == 'produire'
        env: { GH_TOKEN: '${{ github.token }}', FABRIQUE_CLE: '${{ secrets.FABRIQUE_CLE }}' }
        run: |
          mkdir -p ../coffre && gh release download fabrique-coffre -D ../coffre --skip-existing
          for nom in $(cd ../coffre && ls *.json | sed 's/\.json$//'); do
            dest=$BIBLIO; [ "$nom" = modeles ] && dest=$MASSAMBA_MODELS
            python3 studio-video/fabrique/coffre.py ouvre-dossier ../coffre "$nom" "$dest" ../site/cle.priv.json && rm -f ../coffre/$nom.*.msb
          done
          [ -f ../site/etat/etat.json ] && python3 studio-video/fabrique/coffre.py ouvre-dossier ../site/etat etat "$BIBLIO" ../site/cle.priv.json || echo "premier état"
          du -sh "$BIBLIO" "$MASSAMBA_MODELS"
      - name: Journée de production
        if: steps.etat.outputs.faire == 'produire'
        env:
          MASSAMBA_BIBLIO: ${{ env.BIBLIO }}
          MASSAMBA_TROUPE: ${{ env.BIBLIO }}/troupe
          PIPER_VOICES: ${{ env.MASSAMBA_MODELS }}/piper/
          JUGE_LOCAL: ${{ env.MASSAMBA_MODELS }}/juge-local
          FABRIQUE_CADENCE: ${{ inputs.videos }}
          # 22/10/2026 : 50 min par marche (et non 290) — la marche suivante part à l'heure suivante ; les épisodes sont scellés et
          # publiés chaque heure au lieu d'attendre 5 h, et une panne de machine ne perd qu'une heure de travail
          FABRIQUE_MINUTES: '50'
          OMP_NUM_THREADS: '1'
          TOURNE_PROCS: '4'
          GITHUB_TOKEN: ${{ github.token }}
          # écriture des sketchs neufs (recharge.py) : GitHub Models par le jeton de la tâche (permission models: read), gratuit
          HISTOIRES_URL: https://models.github.ai/inference/chat/completions
          HISTOIRES_CLE: ${{ github.token }}
          HISTOIRES_MODELE: openai/gpt-4.1
        run: |
          cd studio-video/moteur-troupe
          python3 autopilot.py jour 2>&1 | grep -vE "onnxruntime|W0000|I0000|XNNPACK" | tail -300
      - name: Sceller et publier (catalogue, vidéos, état)
        if: always() && steps.etat.outputs.faire == 'produire'
        env: { GH_TOKEN: '${{ github.token }}', FABRIQUE_CLE: '${{ secrets.FABRIQUE_CLE }}' }
        run: |
          python3 studio-video/fabrique/vitrine.py construit "$BIBLIO" ../site ../site
          python3 studio-video/fabrique/coffre.py scelle-dossier "$BIBLIO" ../site/etat etat ../site/cle.pub.pem \
            --exclure troupe --exclure prep --exclure decors-casting --exclure scenes --exclure "A PUBLIER" \
            --exclure '*.mp4' --exclure '*.wav' --exclure '*.mp3' > /dev/null
          if [ -d ../archiver ] && [ -n "$(ls ../archiver)" ]; then
            gh release view fabrique-archives >/dev/null 2>&1 || gh release create fabrique-archives --title "Archives de la fabrique (chiffrées)" --notes "Vidéos sorties de l'application ; à ouvrir dans l'application (« Ouvrir un fichier .msb »)."
            gh release upload fabrique-archives ../archiver/* --clobber
          fi
          cd ../site && git checkout -q --orphan publie && git add -A && git -c user.name=fabrique -c user.email=fabrique@users.noreply.github.com commit -qm "Fabrique : production du $(date -u +%F)" && git push -q -f origin publie:fabrique-donnees
