# Teranga Outils — fabrique quotidienne. À placer sur la branche par défaut (claude/innovative-revenue-website-1dqvgq).
# 1. Fiches en attente (tcv.boutique_fiches), 2. nouveaux outils et documents sur mesure écrits par des modèles GRATUITS
# d'OpenRouter, appelés par le serveur de la boutique (GitHub Models a fermé le 30 juillet 2026).
# Chaque classeur est construit, recalculé par LibreOffice et contrôlé avant dépôt (jeton OIDC : aucun secret).
# Publication automatique 24 h après le dépôt (tâche boutique-publication de la base), sauf refus du propriétaire.
name: Boutique fabrique
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      nombre: { description: 'Nouveaux outils Excel à fabriquer (0 à 10)', default: '2' }
      generateurs: { description: 'Nouveaux documents sur mesure (0 à 5)', default: '1' }
      kits: { description: 'Nouveaux kits à imprimer PDF + Word (0 à 10)', default: '2' }
      guides: { description: 'Nouveaux guides gratuits (0 à 10)', default: '2' }
permissions: { contents: read, id-token: write }
concurrency: { group: boutique-fabrique, cancel-in-progress: false }
jobs:
  fabriquer:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { ref: gh-pages, sparse-checkout: scripts/boutique }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Logiciels (openpyxl, python-docx, LibreOffice Calc et Writer)
        run: |
          pip install --quiet openpyxl==3.1.5 python-docx==1.2.0
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-calc-nogui libreoffice-writer-nogui poppler-utils > /dev/null
      - name: Fabriquer, vérifier, déposer
        run: python3 scripts/boutique/fabriquer.py --nombre "${{ inputs.nombre || '2' }}" --generateurs "${{ inputs.generateurs || '1' }}" --kits "${{ inputs.kits || '2' }}" --guides "${{ inputs.guides || '2' }}"
