# Teranga Outils — fabrique quotidienne. À placer sur la branche par défaut (claude/innovative-revenue-website-1dqvgq).
# 1. Fiches en attente (tcv.boutique_fiches), 2. nouveaux outils écrits par GitHub Models (gratuit, jeton de la tâche).
# Chaque classeur est construit, recalculé par LibreOffice et contrôlé avant dépôt (jeton OIDC : aucun secret).
# Publication automatique 24 h après le dépôt (tâche boutique-publication de la base), sauf refus du propriétaire.
name: Boutique fabrique
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      nombre: { description: 'Nouveaux outils à fabriquer (0 à 10)', default: '5' }
permissions: { contents: read, id-token: write, models: read }
concurrency: { group: boutique-fabrique, cancel-in-progress: false }
jobs:
  fabriquer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: gh-pages, sparse-checkout: scripts/boutique }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Logiciels (openpyxl, LibreOffice Calc)
        run: |
          pip install --quiet openpyxl==3.1.5
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-calc-nogui > /dev/null
      - name: Fabriquer, vérifier, déposer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODELE: openai/gpt-4.1-mini
        run: python3 scripts/boutique/fabriquer.py --nombre "${{ inputs.nombre || '5' }}"
