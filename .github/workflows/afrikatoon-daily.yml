name: Afrikatoon — vidéo TikTok quotidienne

on:
  schedule:
    - cron: "15 18 * * *"   # tous les jours à 18h15 GMT (pic d'audience Afrique de l'Ouest)
  workflow_dispatch:
    inputs:
      idea:
        description: "Idée de sketch (optionnel)"
        required: false
      mode:
        description: "draft (brouillon TikTok) ou direct"
        required: false
        default: "draft"

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: afrikatoon-auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer ffmpeg et les dépendances
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt
      - name: Générer et publier
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          VIDEO_PRESET: ${{ vars.VIDEO_PRESET || 'veo3' }}
          IDEA: ${{ github.event.inputs.idea }}
          MODE: ${{ github.event.inputs.mode || 'draft' }}
        run: |
          if [ -n "$IDEA" ]; then
            python run.py run --mode "$MODE" --idea "$IDEA"
          else
            python run.py run --mode "$MODE"
          fi
      - name: Garder la vidéo 14 jours (téléchargeable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            afrikatoon-auto/output/*/final.mp4
            afrikatoon-auto/output/*/kit.json
            afrikatoon-auto/output/*/caption.txt
          retention-days: 14
          if-no-files-found: ignore
      - name: Sauver l'historique et les fiches personnages
        if: always()
        run: |
          git config user.name "afrikatoon-bot"
          git config user.email "afrikatoon-bot@users.noreply.github.com"
          git add state/history.json state/characters 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Afrikatoon : historique du $(date +%F)" && git push)
