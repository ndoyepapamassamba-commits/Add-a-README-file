<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Horizon Cité</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="City-builder 3D dans le navigateur : routes, zonage, services, trafic, budget, du hameau à la mégalopole.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&display=swap">
<style>
/* Interface de jeu : un seul thème sombre, assumé, comme les city-builders.
   Disposition : barre d'outils en bas, panneaux flottants, scène 3D plein écran. */
:root {
  --bg: #0b131c;
  --panel: rgba(19, 29, 41, 0.94);
  --panel-hi: rgba(33, 48, 65, 0.97);
  --panel-lo: rgba(11, 18, 26, 0.88);
  --line: rgba(150, 185, 220, 0.16);
  --line-hi: rgba(150, 185, 220, 0.34);
  --text: #e8eff6;
  --muted: #8fa3b8;
  --accent: #46aef6;
  --accent-deep: #2370c0;
  --good: #5fd068;
  --warn: #f2c43a;
  --bad: #ef5552;
  --r: #74d04c;
  --c: #5aaaf6;
  --i: #e8c23a;
  --o: #31c4c8;
  --paper: #f3f6f9;
  --ink: #18222d;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Exo 2", "Segoe UI", system-ui, sans-serif;
  --radius: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 14px/1.4 var(--font-ui); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#ui button, #ui input, #ui textarea, #ui .panel, #ui .bar, #ui .milestone, #ui .advisor, #ui .chirp-bubble { pointer-events: auto; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { width: 22px; height: 22px; display: block; flex: none; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.ok { color: var(--good); }
.bad { color: var(--bad); }
kbd { display: inline-block; min-width: 22px; padding: 1px 6px; margin: 0 2px; border-radius: 5px; border: 1px solid var(--line-hi); background: var(--panel-lo); font: 600 12px var(--font-ui); text-align: center; color: var(--text); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 12px 34px rgba(0,0,0,0.45); backdrop-filter: blur(6px); }
.panel h3, .panel h2, .panel h4 { margin: 0; font-family: var(--font-display); font-weight: 700; letter-spacing: 0.01em; }
.panel h3 { font-size: 16px; display: flex; align-items: center; gap: 8px; }
.panel h2 { font-size: 20px; display: flex; align-items: center; gap: 10px; }
.panel h4 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px; display: flex; gap: 6px; align-items: center; }
.panel h4 svg { width: 16px; height: 16px; color: var(--accent); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-hi); background: var(--panel-hi); font-weight: 600; transition: background .12s, border-color .12s, transform .08s; }
.btn:hover { background: #2c4058; border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: linear-gradient(180deg, #4ab2f8, #2a7fd0); border-color: #6cc2ff; color: #fff; }
.btn.primary:hover { background: linear-gradient(180deg, #5cbcff, #3189dc); }
.btn.danger { border-color: rgba(239,85,82,.5); }
.btn.danger:hover { background: #5a2a2c; border-color: var(--bad); }
.btn.big { padding: 12px 18px; font-size: 15px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.mini { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 7px; border: 1px solid transparent; background: transparent; color: var(--muted); }
.mini:hover { background: var(--panel-hi); color: var(--text); border-color: var(--line); }
.mini svg { width: 16px; height: 16px; }
.mini.danger:hover { color: var(--bad); }

/* ---------- barre du haut ---------- */
.top-left, .top-right, .top-center { position: fixed; top: max(10px, env(safe-area-inset-top, 0px)); display: flex; gap: 8px; align-items: flex-start; z-index: 15; }
.top-left { left: max(12px, env(safe-area-inset-left, 0px)); }
.top-right { right: max(12px, env(safe-area-inset-right, 0px)); }
.top-center { left: 50%; transform: translateX(-50%); flex-direction: column; align-items: center; }
.hud-btn { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); box-shadow: 0 6px 18px rgba(0,0,0,.35); font-weight: 600; }
.hud-btn:hover { border-color: var(--accent); }
.hud-btn.icon-only { width: 42px; padding: 0; justify-content: center; }
.advisor { max-width: 340px; padding: 8px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--warn); box-shadow: 0 6px 18px rgba(0,0,0,.35); font-size: 13px; }
.adv-title { font: 700 11px var(--font-display); text-transform: uppercase; letter-spacing: .1em; color: var(--warn); margin-bottom: 2px; }
.chirp-btn { position: relative; width: 52px; height: 52px; border-radius: 50%; border: 2px solid rgba(255,255,255,.85); background: radial-gradient(circle at 35% 30%, #6cc8ff, #2a86d6); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.chirp-btn svg { width: 28px; height: 28px; }
.chirp-btn:hover { transform: scale(1.05); }
.badge { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--bad); color: #fff; font: 700 11px/20px var(--font-ui); text-align: center; border: 2px solid #fff; }
.chirp-bubble { margin-top: 10px; max-width: min(420px, 86vw); padding: 10px 14px; border-radius: 12px; background: var(--paper); color: var(--ink); font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.4); position: relative; animation: pop .25s ease-out; }
.chirp-bubble::before { content: ""; position: absolute; top: -7px; left: 50%; transform: translateX(-50%) rotate(45deg); width: 14px; height: 14px; background: var(--paper); }
.chirp-feed { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); width: min(440px, 94vw); max-height: min(60vh, 520px); display: flex; flex-direction: column; z-index: 16; }
.cf-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.cf-head svg { color: var(--accent); }
.cf-list { overflow-y: auto; padding: 6px 12px 10px; }
.chirp { display: grid; grid-template-columns: 36px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.chirp:last-child { border-bottom: 0; }
.chirp .av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 700 15px var(--font-display); color: #fff; }
.chirp .who { font-size: 13px; }
.chirp .who span { color: var(--muted); font-size: 12px; }
.chirp .txt { font-size: 13.5px; margin-top: 2px; }
.empty { padding: 20px 0; text-align: center; color: var(--muted); }

/* ---------- vues d'information ---------- */
.info-panel { position: fixed; top: 62px; left: max(12px, env(safe-area-inset-left, 0px)); width: 360px; max-width: calc(100vw - 24px); padding: 10px; z-index: 16; }
.ip-head { padding: 2px 4px 8px; }
.ip-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ip-grid button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-lo); font-size: 11.5px; text-align: center; line-height: 1.2; }
.ip-grid button:hover { border-color: var(--accent); }
.ip-grid button.on { background: var(--accent-deep); border-color: var(--accent); }
.legend { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 132px; padding: 10px 12px; min-width: 220px; z-index: 14; }
.legend h4 { color: var(--text); }
.lg-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 2px 0; }
.lg-row i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.lg-sum { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- barre du bas ---------- */
.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 0 max(10px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }
.milestone { position: relative; max-width: 1480px; height: 18px; margin: 0 auto 6px; border-radius: 9px; overflow: hidden; background: rgba(11,18,26,.82); border: 1px solid var(--line); }
.ms-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #1f5fa6, #46aef6); transition: width .4s; }
.ms-label { position: relative; font: 600 11px/16px var(--font-display); text-align: center; letter-spacing: .04em; text-shadow: 0 1px 2px rgba(0,0,0,.7); font-variant-numeric: tabular-nums; }
.bar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; max-width: 1480px; height: 78px; margin: 0 auto; padding: 0 12px; border-radius: 14px; background: linear-gradient(180deg, rgba(36,52,70,.97), rgba(17,26,37,.97)); border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(0,0,0,.5); }
.bar-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
.stat { display: flex; align-items: center; gap: 8px; }
.stat svg { width: 26px; height: 26px; color: var(--accent); }
.stat b { display: block; font: 700 19px var(--font-display); font-variant-numeric: tabular-nums; }
.stat small { display: block; font-size: 11.5px; font-variant-numeric: tabular-nums; min-height: 15px; }
.happy svg { width: 30px; height: 30px; color: inherit; }
.rci { display: flex; gap: 6px; align-items: flex-end; height: 56px; padding: 4px 8px; border-radius: 8px; background: rgba(0,0,0,.25); }
.rci-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.rci-bar { position: relative; width: 12px; height: 38px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
.rci-bar i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--c); transition: height .5s; }
.rci-col span { font: 700 10px var(--font-display); color: var(--muted); }
.bar-center { display: flex; justify-content: flex-start; gap: 1px; overflow-x: auto; scrollbar-width: none; min-width: 0; padding: 4px 0; }
.bar-center > :first-child { margin-left: auto; }
.bar-center > :last-child { margin-right: auto; }
.bar-center::-webkit-scrollbar { display: none; }
.cat { flex: none; width: 58px; height: 62px; border-radius: 10px; border: 1px solid transparent; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #c8d6e5; transition: background .12s, color .12s; }
.cat svg { width: 26px; height: 26px; }
.cat span { font-size: 10px; line-height: 1.1; text-align: center; max-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat:hover { background: rgba(70,174,246,.14); color: #fff; }
.cat.on { background: linear-gradient(180deg, #2f86d8, #1e5f9e); border-color: #6cc2ff; color: #fff; }
.cat[data-cat="bulldoze"].on { background: linear-gradient(180deg, #c8463f, #8e2a26); border-color: #ff8a80; }
.bar-right { display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
.money b, .date b { display: block; font: 700 18px var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.money small, .date small { display: block; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.money small.ok { color: var(--good); }
.money small.bad { color: var(--bad); }
.date { text-align: right; }
.speeds { display: flex; border-radius: 9px; overflow: hidden; border: 1px solid var(--line-hi); }
.speeds button { width: 34px; height: 34px; border: 0; background: var(--panel-lo); display: grid; place-items: center; color: #c8d6e5; }
.speeds button + button { border-left: 1px solid var(--line); }
.speeds button svg { width: 16px; height: 16px; }
.speeds button:hover { background: var(--panel-hi); }
.speeds button.on { background: var(--accent-deep); color: #fff; }
body.paused .speeds button[data-sp="0"] { background: #b8862a; animation: blink 1.2s infinite; }
body.paused::after { content: ""; position: fixed; inset: 0; border: 3px solid rgba(242,196,58,.55); pointer-events: none; z-index: 30; animation: blink 1.6s infinite; }

/* ---------- panneau d'outils ---------- */
.tool-panel { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(118px + env(safe-area-inset-bottom, 0px)); width: max-content; min-width: min(420px, calc(100vw - 20px)); max-width: min(1180px, calc(100vw - 20px)); padding: 10px 12px 12px; z-index: 18; animation: rise .18s ease-out; }
.tp-head { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
.tp-head h3 { font-size: 17px; }
.tp-head .close { margin-left: auto; }
.modes { display: flex; gap: 4px; padding: 3px; border-radius: 9px; background: var(--panel-lo); border: 1px solid var(--line); }
.modes button { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 7px; border: 0; background: transparent; color: #c8d6e5; font-size: 12.5px; font-weight: 600; }
.modes button svg { width: 16px; height: 16px; }
.modes button.on { background: var(--accent-deep); color: #fff; }
.items { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.item { position: relative; flex: none; width: 120px; padding: 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-lo); display: flex; flex-direction: column; gap: 3px; text-align: left; transition: border-color .12s, background .12s, transform .1s; }
.item:hover { border-color: var(--accent); transform: translateY(-2px); }
.item.on { border-color: #6cc2ff; background: #1e4f80; box-shadow: 0 0 0 2px rgba(70,174,246,.35) inset; }
.item .thumb { width: 100%; aspect-ratio: 4 / 3; border-radius: 7px; overflow: hidden; background: radial-gradient(circle at 50% 40%, #3a5068, #1a2633); display: grid; place-items: center; }
.item .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.item .thumb svg { width: 40px; height: 40px; color: #9fd3ff; }
.item .ph { width: 30px; height: 30px; border-radius: 50%; border: 3px solid rgba(255,255,255,.15); border-top-color: var(--accent); animation: spin 1s linear infinite; }
.iname { font-size: 12px; font-weight: 600; line-height: 1.2; min-height: 29px; }
.iprice { font-size: 11.5px; color: var(--warn); font-variant-numeric: tabular-nums; }
.item.locked { opacity: .55; }
.item.locked .thumb { filter: grayscale(1); }
.lock { position: absolute; top: 10px; left: 10px; right: 10px; padding: 2px 6px; border-radius: 6px; background: rgba(0,0,0,.72); font-size: 10px; text-align: center; color: #ffd27a; }
.item.built { opacity: .6; }
.lines { margin-top: 10px; display: grid; gap: 4px; }
.line-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 6px; border-radius: 7px; background: var(--panel-lo); }
.line-row i { width: 14px; height: 14px; border-radius: 50%; }
.line-row button { margin-left: auto; }

/* ---------- inspecteur ---------- */
.inspector { position: fixed; top: 62px; right: max(12px, env(safe-area-inset-right, 0px)); width: 340px; max-width: calc(100vw - 24px); max-height: calc(100vh - 240px); overflow-y: auto; padding: 12px 14px; z-index: 17; animation: pop .18s ease-out; }
.in-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.in-head h3 { font-size: 17px; text-wrap: balance; }
.in-head .muted { font-size: 12.5px; }
.levels { display: flex; gap: 4px; margin: 2px 0 10px; }
.levels i { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); }
.levels i.on { background: var(--zc); }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 13px; font-variant-numeric: tabular-nums; }
.kv span { color: var(--muted); }
.kv.total { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 6px; font-weight: 700; }
.ib-row { display: grid; grid-template-columns: 110px 1fr 74px; align-items: center; gap: 8px; font-size: 12.5px; padding: 3px 0; }
.ib-row span { color: var(--muted); }
.ib-row em { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; }
.ib-bar { height: 7px; border-radius: 4px; background: rgba(255,255,255,.09); overflow: hidden; }
.ib-bar i { display: block; height: 100%; border-radius: 4px; }
.kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-top: 8px; font-size: 12.5px; }
.kv-grid div { display: flex; justify-content: space-between; padding: 3px 8px; border-radius: 6px; background: var(--panel-lo); }
.kv-grid span:first-child { color: var(--muted); }
.problem { display: flex; align-items: center; gap: 8px; padding: 7px 9px; margin-bottom: 8px; border-radius: 8px; background: rgba(239,85,82,.14); border: 1px solid rgba(239,85,82,.35); font-weight: 600; font-size: 13px; }
.problem img { width: 24px; height: 24px; }
.hint { margin-top: 8px; padding: 7px 9px; border-radius: 8px; background: var(--panel-lo); font-size: 12.5px; color: var(--muted); }
.hint.bad { color: #ffb3b1; }
.in-actions { display: flex; gap: 8px; margin-top: 12px; }
.in-actions .btn { flex: 1; }

/* ---------- fenêtres ---------- */
.modal-wrap { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5,10,16,.55); z-index: 40; padding: 16px; }
.modal { width: min(760px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: 16px 20px 20px; animation: pop .18s ease-out; }
.modal.menu, .modal.options, .modal.saves { width: min(520px, 100%); }
.md-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.md-head h2 svg { color: var(--accent); width: 24px; height: 24px; }
.menu-grid { display: grid; gap: 8px; }
.budget { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
.budget section { min-width: 0; }
.budget .wide { grid-column: 1 / -1; }
.tax { display: grid; grid-template-columns: 140px 1fr 50px; align-items: center; gap: 10px; padding: 4px 0; }
.tax span { display: flex; align-items: center; gap: 8px; }
.tax i { width: 12px; height: 12px; border-radius: 3px; }
.tax b { text-align: right; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
#hist { width: 100%; height: 120px; display: block; border-radius: 8px; background: var(--panel-lo); }
.loans { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.loan-row { font-size: 13px; padding: 4px 0; font-variant-numeric: tabular-nums; }
.slots { display: grid; gap: 6px; margin-bottom: 16px; }
.slot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px; background: var(--panel-lo); border: 1px solid var(--line); }
.slot-actions { display: flex; gap: 6px; align-items: center; }
.code-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
textarea { width: 100%; resize: vertical; border-radius: 8px; border: 1px solid var(--line-hi); background: var(--panel-lo); color: var(--text); font: 12px ui-monospace, Menlo, Consolas, monospace; padding: 8px; user-select: text; -webkit-user-select: text; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.seg { display: flex; border: 1px solid var(--line-hi); border-radius: 8px; overflow: hidden; }
.seg button { padding: 6px 12px; border: 0; background: var(--panel-lo); font-size: 13px; font-weight: 600; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-deep); color: #fff; }
.opt input[type="range"] { max-width: 220px; }
.help { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
.help .wide { grid-column: 1 / -1; }
.help .kv b { font-weight: 500; text-align: right; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 13.5px; }

/* ---------- notifications ---------- */
.toasts { position: fixed; top: 140px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; z-index: 35; }
.toast { padding: 9px 16px; border-radius: 10px; background: var(--panel-hi); border: 1px solid var(--line-hi); box-shadow: 0 8px 22px rgba(0,0,0,.4); font-weight: 600; font-size: 13.5px; animation: pop .2s ease-out; transition: opacity .4s, transform .4s; max-width: 86vw; }
.toast.good { border-color: rgba(95,208,104,.6); }
.toast.bad { border-color: rgba(239,85,82,.7); }
.toast.out { opacity: 0; transform: translateY(-8px); }
